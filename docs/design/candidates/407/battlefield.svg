<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="smokeSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="75%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="mudGround" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="30%" stop-color="#3f1d0b"/>
      <stop offset="70%" stop-color="#2a1205"/>
      <stop offset="100%" stop-color="#190a02"/>
    </linearGradient>
    <linearGradient id="sandbagTexture" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#582a0b"/>
    </linearGradient>
    <radialGradient id="blastSun" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#451a03" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Atmospheric Smoky Amber Sky -->
  <rect width="1600" height="900" fill="url(#smokeSky)"/>
  <circle cx="800" cy="360" r="260" fill="url(#blastSun)"/>

  <!-- Static Smoke Billows & Atmospheric Pillars -->
  <g fill="#1c1917" opacity="0.35">
    <circle cx="280" cy="340" r="160"/>
    <circle cx="440" cy="280" r="200"/>
    <circle cx="1180" cy="320" r="180"/>
    <circle cx="1380" cy="260" r="220"/>
  </g>

  <!-- Distant Crumbling Brick Arches & Fortress Ruins Silhouettes -->
  <g fill="#171717">
    <!-- Center Ruined Cathedral / Gate Arch -->
    <path d="M680,480 L680,360 Q800,320 920,360 L920,480 L880,480 L880,380 Q800,355 720,380 L720,480 Z"/>
    <!-- Broken Columns & Spires -->
    <polygon points="560,480 575,390 610,480"/>
    <polygon points="620,480 635,420 655,480"/>
    <polygon points="950,480 970,410 995,480"/>
    <polygon points="1020,480 1045,370 1070,480"/>
  </g>

  <!-- Distant Trench Parapets & Barbed Wire Pickets (Static crossed posts) -->
  <g stroke="#292524" stroke-width="4">
    <line x1="380" y1="460" x2="410" y2="520"/>
    <line x1="410" y1="460" x2="380" y2="520"/>
    <line x1="480" y1="465" x2="510" y2="525"/>
    <line x1="510" y1="465" x2="480" y2="525"/>
    <line x1="1120" y1="465" x2="1150" y2="525"/>
    <line x1="1150" y1="465" x2="1120" y2="525"/>
    <line x1="1220" y1="460" x2="1250" y2="520"/>
    <line x1="1250" y1="460" x2="1220" y2="520"/>
  </g>
  <!-- Barbed Wire horizontal taut strings -->
  <line x1="360" y1="485" x2="530" y2="485" stroke="#44403c" stroke-width="2"/>
  <line x1="1100" y1="485" x2="1270" y2="485" stroke="#44403c" stroke-width="2"/>

  <!-- Ground: Muddy Rutted Battlefield Plateau -->
  <polygon points="0,500 1600,500 1600,900 0,900" fill="url(#mudGround)"/>

  <!-- Smooth Mud Vehicle Ruts & Tracks (Leading into open center area) -->
  <g stroke="#190a02" stroke-width="12" stroke-linecap="round" opacity="0.6">
    <path d="M540,510 Q620,680 520,900" fill="none"/>
    <path d="M590,510 Q670,680 570,900" fill="none"/>
    <path d="M1060,510 Q980,680 1080,900" fill="none"/>
    <path d="M1010,510 Q930,680 1030,900" fill="none"/>
  </g>

  <!-- Left Flank Sandbag Revetment Outpost -->
  <g fill="url(#sandbagTexture)" stroke="#261005" stroke-width="3">
    <!-- Tier 1 (Lowest) -->
    <rect x="-20" y="720" width="130" height="42" rx="14"/>
    <rect x="90" y="720" width="130" height="42" rx="14"/>
    <rect x="200" y="720" width="130" height="42" rx="14"/>
    <rect x="310" y="720" width="130" height="42" rx="14"/>
    <!-- Tier 2 -->
    <rect x="30" y="680" width="130" height="42" rx="14"/>
    <rect x="140" y="680" width="130" height="42" rx="14"/>
    <rect x="250" y="680" width="130" height="42" rx="14"/>
    <!-- Tier 3 (Top) -->
    <rect x="80" y="640" width="130" height="42" rx="14"/>
    <rect x="190" y="640" width="130" height="42" rx="14"/>
  </g>
  <!-- Wooden trench support post on left -->
  <rect x="370" y="660" width="18" height="120" fill="#261005" rx="2"/>

  <!-- Right Flank Sandbag Outpost -->
  <g fill="url(#sandbagTexture)" stroke="#261005" stroke-width="3">
    <!-- Tier 1 -->
    <rect x="1160" y="720" width="130" height="42" rx="14"/>
    <rect x="1270" y="720" width="130" height="42" rx="14"/>
    <rect x="1380" y="720" width="130" height="42" rx="14"/>
    <rect x="1490" y="720" width="130" height="42" rx="14"/>
    <!-- Tier 2 -->
    <rect x="1220" y="680" width="130" height="42" rx="14"/>
    <rect x="1330" y="680" width="130" height="42" rx="14"/>
    <rect x="1440" y="680" width="130" height="42" rx="14"/>
    <!-- Tier 3 -->
    <rect x="1280" y="640" width="130" height="42" rx="14"/>
    <rect x="1390" y="640" width="130" height="42" rx="14"/>
  </g>
  <!-- Wooden post right -->
  <rect x="1210" y="660" width="18" height="120" fill="#261005" rx="2"/>

  <!-- Steel Czech Hedgehog Anti-Tank Obstacle (Midground Right) -->
  <g stroke="#171717" stroke-width="12" stroke-linecap="square">
    <line x1="1100" y1="580" x2="1160" y2="640"/>
    <line x1="1160" y1="580" x2="1100" y2="640"/>
    <line x1="1130" y1="565" x2="1130" y2="655"/>
  </g>

  <!-- Clear Broad Ground for Characters (Center Basin Flat Terrain) -->
  <ellipse cx="800" cy="770" rx="260" ry="60" fill="#582a0b" opacity="0.35"/>
  <ellipse cx="800" cy="810" rx="320" ry="70" fill="#2a1205" opacity="0.5"/>
</svg>
