<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cinemaWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="screenBeam" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#93c5fd" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redCarpet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="40%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="velvetSeat" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#3f0707"/>
    </linearGradient>
  </defs>

  <!-- Dark Hall Atmosphere -->
  <rect width="1600" height="900" fill="url(#cinemaWall)"/>

  <!-- Static Projector Light Cone Ray slicing through the hall -->
  <polygon points="800,20 200,900 1400,900" fill="url(#screenBeam)" opacity="0.35"/>
  <polygon points="800,20 500,420 1100,420" fill="#ffffff" opacity="0.2"/>

  <!-- TOP GLOWING SILVER SCREEN (Upper Perspective Horizon) -->
  <rect x="420" y="80" width="760" height="340" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="440" y="95" width="720" height="310" fill="#e0f2fe"/>
  <!-- Screen Film Scene Silhouette Preview -->
  <path d="M440,320 Q640,240 800,290 T1160,260 L1160,405 L440,405 Z" fill="#38bdf8" opacity="0.3"/>
  <circle cx="950" cy="180" r="35" fill="#fef08a" opacity="0.7"/>

  <!-- Top Dramatic Red Theater Drapery Valance (Swags & Tails) -->
  <g fill="#7f1d1d">
    <!-- Center swag curves -->
    <path d="M380,40 Q580,120 780,40 L780,0 L380,0 Z"/>
    <path d="M780,40 Q980,120 1180,40 L1180,0 L780,0 Z"/>
    <!-- Outer curtains -->
    <rect x="360" y="0" width="70" height="420"/>
    <rect x="1170" y="0" width="70" height="420"/>
  </g>
  <g fill="#991b1b">
    <path d="M400,30 Q580,95 760,30 L760,0 L400,0 Z"/>
    <path d="M800,30 Q980,95 1160,30 L1160,0 L800,0 Z"/>
  </g>

  <!-- SYMMETRICAL PERSPECTIVE SLOPING AISLE (Center Red Carpet) -->
  <polygon points="680,420 920,420 1180,900 420,900" fill="url(#redCarpet)"/>
  <!-- Golden Trim Aisle Lines -->
  <line x1="680" y1="420" x2="420" y2="900" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>
  <line x1="920" y1="420" x2="1180" y2="900" stroke="#f59e0b" stroke-width="3" opacity="0.8"/>

  <!-- Low Aisle Runner Glow Lights (Step path markers) -->
  <g fill="#fef08a" opacity="0.85">
    <circle cx="650" cy="460" r="3"/>
    <circle cx="950" cy="460" r="3"/>
    <circle cx="615" cy="520" r="3.5"/>
    <circle cx="985" cy="520" r="3.5"/>
    <circle cx="575" cy="600" r="4"/>
    <circle cx="1025" cy="600" r="4"/>
    <circle cx="525" cy="700" r="4.5"/>
    <circle cx="1075" cy="700" r="4.5"/>
    <circle cx="465" cy="820" r="5"/>
    <circle cx="1135" cy="820" r="5"/>
  </g>

  <!-- LEFT PLUSH THEATER SEATING ROWS (Sloping towards screen) -->
  <!-- Row 1 (Back) -->
  <rect x="260" y="440" width="380" height="35" rx="8" fill="url(#velvetSeat)"/>
  <!-- Row 2 -->
  <rect x="200" y="490" width="400" height="42" rx="10" fill="url(#velvetSeat)"/>
  <!-- Row 3 -->
  <rect x="130" y="550" width="430" height="52" rx="12" fill="url(#velvetSeat)"/>
  <!-- Row 4 -->
  <rect x="50" y="630" width="460" height="65" rx="14" fill="url(#velvetSeat)"/>
  <!-- Row 5 (Front) -->
  <rect x="-40" y="730" width="490" height="85" rx="18" fill="url(#velvetSeat)"/>

  <!-- RIGHT PLUSH THEATER SEATING ROWS -->
  <!-- Row 1 (Back) -->
  <rect x="960" y="440" width="380" height="35" rx="8" fill="url(#velvetSeat)"/>
  <!-- Row 2 -->
  <rect x="1000" y="490" width="400" height="42" rx="10" fill="url(#velvetSeat)"/>
  <!-- Row 3 -->
  <rect x="1040" y="550" width="430" height="52" rx="12" fill="url(#velvetSeat)"/>
  <!-- Row 4 -->
  <rect x="1090" y="630" width="460" height="65" rx="14" fill="url(#velvetSeat)"/>
  <!-- Row 5 (Front) -->
  <rect x="1150" y="730" width="490" height="85" rx="18" fill="url(#velvetSeat)"/>

  <!-- Seat Row Headrest Highlights -->
  <g fill="#ef4444" opacity="0.3">
    <ellipse cx="430" cy="445" rx="150" ry="6"/>
    <ellipse cx="1170" cy="445" rx="150" ry="6"/>
    <ellipse cx="380" cy="495" rx="170" ry="8"/>
    <ellipse cx="1220" cy="495" rx="170" ry="8"/>
    <ellipse cx="320" cy="558" rx="190" ry="10"/>
    <ellipse cx="1280" cy="558" rx="190" ry="10"/>
    <ellipse cx="260" cy="640" rx="210" ry="12"/>
    <ellipse cx="1340" cy="640" rx="210" ry="12"/>
    <ellipse cx="180" cy="745" rx="230" ry="16"/>
    <ellipse cx="1420" cy="745" rx="230" ry="16"/>
  </g>

  <!-- Wide Symmetrical Clean Floor Area for 81x87 Avatar -->
  <ellipse cx="800" cy="760" rx="170" ry="40" fill="#450a0a" opacity="0.5"/>
</svg>
