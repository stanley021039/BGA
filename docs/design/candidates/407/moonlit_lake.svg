<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#e0e7ff" stop-opacity="0.8"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lakeWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="35%" stop-color="#0a192f"/>
      <stop offset="75%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#031124"/>
    </linearGradient>
    <linearGradient id="moonColumn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="1600" height="900" fill="url(#nightSky)"/>

  <!-- Dense Static Starlight Matrix -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="280" cy="140" r="1" opacity="0.6"/>
    <circle cx="390" cy="60" r="2" opacity="0.9"/>
    <circle cx="510" cy="110" r="1" opacity="0.5"/>
    <circle cx="670" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="920" cy="90" r="2" opacity="0.8"/>
    <circle cx="1120" cy="130" r="1.5" opacity="0.6"/>
    <circle cx="1280" cy="65" r="2.5" opacity="0.95"/>
    <circle cx="1450" cy="110" r="1" opacity="0.7"/>
    <circle cx="1520" cy="75" r="2" opacity="0.85"/>
    <circle cx="210" cy="220" r="1.5" opacity="0.7"/>
    <circle cx="450" cy="250" r="1" opacity="0.5"/>
    <circle cx="1390" cy="210" r="1.5" opacity="0.6"/>
  </g>

  <!-- Luminous Full Moon & Halo -->
  <circle cx="800" cy="180" r="180" fill="url(#moonHalo)"/>
  <circle cx="800" cy="180" r="62" fill="#f8fafc"/>
  <!-- Subtle Moon Mare Shadows -->
  <path d="M780,150 Q810,140 825,160 Q815,185 790,195 Q765,180 780,150 Z" fill="#cbd5e1" opacity="0.5"/>
  <circle cx="820" cy="195" r="14" fill="#cbd5e1" opacity="0.4"/>
  <circle cx="765" cy="190" r="10" fill="#cbd5e1" opacity="0.35"/>

  <!-- Distant Mountain Silhouettes (Layer 1 - Deep Indigo) -->
  <polygon points="0,480 180,410 390,460 580,390 820,470 1080,380 1320,440 1480,400 1600,450 1600,520 0,520" fill="#1e1b4b" opacity="0.6"/>
  <!-- Distant Mountain Silhouettes (Layer 2 - Midnight Blue) -->
  <polygon points="0,510 140,460 310,485 490,430 710,500 950,420 1190,490 1410,450 1600,485 1600,540 0,540" fill="#0f172a" opacity="0.85"/>
  <!-- Distant Mountain Silhouettes (Layer 3 - Sharp Dark Rim) -->
  <polygon points="0,540 220,490 420,530 650,470 880,530 1140,460 1370,520 1600,490 1600,550 0,550" fill="#090d16"/>

  <!-- Lake Horizon & Calm Water Plane -->
  <rect y="540" width="1600" height="360" fill="url(#lakeWater)"/>

  <!-- Vertical Moonlight Reflection Spindle -->
  <polygon points="760,540 840,540 910,880 690,880" fill="url(#moonColumn)" opacity="0.4"/>

  <!-- Horizontal Shimmering Ripple Lines (Pure Static Vectors) -->
  <g stroke="#e0e7ff" stroke-width="1.8" stroke-linecap="round" opacity="0.85">
    <line x1="770" y1="550" x2="830" y2="550"/>
    <line x1="755" y1="562" x2="845" y2="562"/>
    <line x1="740" y1="578" x2="860" y2="578" stroke-width="2.2"/>
    <line x1="720" y1="595" x2="880" y2="595"/>
    <line x1="700" y1="615" x2="900" y2="615" stroke-width="2.5"/>
    <line x1="680" y1="640" x2="920" y2="640"/>
    <line x1="650" y1="670" x2="950" y2="670" stroke-width="3"/>
    <line x1="620" y1="705" x2="980" y2="705"/>
    <line x1="580" y1="745" x2="1020" y2="745" stroke-width="3.5"/>
    <line x1="530" y1="790" x2="1070" y2="790"/>
    <line x1="470" y1="840" x2="1130" y2="840" stroke-width="4"/>
    <line x1="420" y1="885" x2="1180" y2="885" stroke-width="4.5"/>
  </g>

  <!-- Ambient Lake Ripples on Periphery -->
  <g stroke="#38bdf8" stroke-width="1.2" opacity="0.3" stroke-linecap="round">
    <line x1="220" y1="620" x2="380" y2="620"/>
    <line x1="180" y1="690" x2="410" y2="690"/>
    <line x1="1200" y1="630" x2="1360" y2="630"/>
    <line x1="1140" y1="710" x2="1420" y2="710"/>
  </g>

  <!-- Clean Wide Ground Shore Banks (Bottom Center Left/Right for character) -->
  <path d="M0,780 Q250,750 480,830 L420,900 L0,900 Z" fill="#090d16"/>
  <path d="M1600,770 Q1350,740 1120,830 L1180,900 L1600,900 Z" fill="#090d16"/>
  <!-- Dry sandy bank foreground strip -->
  <path d="M380,860 Q800,820 1220,860 L1260,900 L340,900 Z" fill="#0b1326"/>

  <!-- Left Foreground Cattails & Reeds Silhouette -->
  <g fill="#020617" stroke="#020617" stroke-linecap="round">
    <path d="M60,900 Q80,720 90,640" stroke-width="4" fill="none"/>
    <ellipse cx="90" cy="620" rx="6" ry="24"/>
    <path d="M100,900 Q130,750 140,660" stroke-width="4" fill="none"/>
    <ellipse cx="140" cy="640" rx="6" ry="26"/>
    <path d="M30,900 Q60,780 75,700" stroke-width="3" fill="none"/>
    <path d="M140,900 Q180,790 220,720" stroke-width="3" fill="none"/>
  </g>

  <!-- Right Foreground Reeds -->
  <g fill="#020617" stroke="#020617" stroke-linecap="round">
    <path d="M1540,900 Q1520,730 1510,650" stroke-width="4" fill="none"/>
    <ellipse cx="1510" cy="630" rx="6" ry="24"/>
    <path d="M1500,900 Q1470,760 1460,670" stroke-width="4" fill="none"/>
    <ellipse cx="1460" cy="650" rx="6" ry="26"/>
    <path d="M1570,900 Q1550,790 1530,710" stroke-width="3" fill="none"/>
    <path d="M1450,900 Q1410,810 1370,730" stroke-width="3" fill="none"/>
  </g>
</svg>
