<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="emeraldTile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="bathFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="brassGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="35%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="tubWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wall: Emerald Green Subway Tile Field -->
  <rect width="1600" height="560" fill="url(#emeraldTile)"/>

  <!-- Static Subway Tile Grid Pattern -->
  <g stroke="#022c22" stroke-width="2" opacity="0.45">
    <!-- Horizontal Grout Lines -->
    <line x1="0" y1="40" x2="1600" y2="40"/><line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="120" x2="1600" y2="120"/><line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="200" x2="1600" y2="200"/><line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="280" x2="1600" y2="280"/><line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="0" y1="360" x2="1600" y2="360"/><line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="440" x2="1600" y2="440"/><line x1="0" y1="480" x2="1600" y2="480"/>
    <line x1="0" y1="520" x2="1600" y2="520"/>
  </g>

  <!-- High Frosted Window (Upper Right) casting diffused light beam -->
  <rect x="1220" y="60" width="280" height="240" rx="6" fill="#f8fafc" stroke="url(#brassGold)" stroke-width="8"/>
  <line x1="1360" y1="60" x2="1360" y2="300" stroke="url(#brassGold)" stroke-width="6"/>
  <line x1="1220" y1="180" x2="1500" y2="180" stroke="url(#brassGold)" stroke-width="6"/>
  <!-- Static Sunbeam Slice -->
  <polygon points="1220,100 480,900 1100,900 1500,280" fill="url(#windowLight)" opacity="0.25"/>

  <!-- Round Brass Mirror on Wall (Upper Left) -->
  <circle cx="360" cy="220" r="110" fill="none" stroke="url(#brassGold)" stroke-width="8"/>
  <circle cx="360" cy="220" r="102" fill="#e0f2fe" opacity="0.6"/>
  <path d="M290,170 Q360,130 430,170" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8"/>

  <!-- Hanging Houseplant (Monstera / Ivy) in Brass Planter -->
  <line x1="140" y1="0" x2="140" y2="140" stroke="url(#brassGold)" stroke-width="3"/>
  <ellipse cx="140" cy="150" rx="35" ry="20" fill="url(#brassGold)"/>
  <!-- Green Cascading Leaves -->
  <path d="M130,160 Q100,210 110,270 Q130,230 140,165 Z" fill="#15803d"/>
  <path d="M145,160 Q180,220 165,285 Q150,230 140,165 Z" fill="#16a34a"/>
  <path d="M125,160 Q80,240 85,310 Q110,250 135,165 Z" fill="#15803d"/>

  <!-- Clean Warm Tiled Floor Plane -->
  <rect y="540" width="1600" height="360" fill="url(#bathFloor)"/>
  <!-- Large Diagonal Grid Floor Pattern -->
  <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="580" x2="1600" y2="580"/>
    <line x1="0" y1="640" x2="1600" y2="640"/>
    <line x1="0" y1="720" x2="1600" y2="720"/>
    <line x1="0" y1="810" x2="1600" y2="810"/>
    <!-- Diagonal floor joints -->
    <line x1="200" y1="540" x2="600" y2="900"/>
    <line x1="500" y1="540" x2="900" y2="900"/>
    <line x1="800" y1="540" x2="1200" y2="900"/>
    <line x1="1100" y1="540" x2="1500" y2="900"/>
  </g>

  <!-- Offset Standalone White Porcelain Clawfoot Bathtub (Positioned to Right, Leaving Center-Left Clear) -->
  <!-- Tub Cast Shadow -->
  <ellipse cx="1060" cy="745" rx="360" ry="45" fill="#475569" opacity="0.4"/>

  <!-- Brass Ornate Claw Feet -->
  <path d="M780,710 L760,760 L795,760 Z" fill="url(#brassGold)"/>
  <path d="M860,720 L850,755 L880,755 Z" fill="url(#brassGold)"/>
  <path d="M1260,720 L1270,755 L1240,755 Z" fill="url(#brassGold)"/>
  <path d="M1340,710 L1360,760 L1325,760 Z" fill="url(#brassGold)"/>

  <!-- Tub Exterior Basin Body -->
  <path d="M740,560 C730,680 820,730 1060,730 C1300,730 1390,680 1380,560 Z" fill="url(#tubWhite)"/>
  <!-- Tub Upper Rim Roll -->
  <ellipse cx="1060" cy="560" rx="330" ry="45" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4"/>
  <!-- Tub Interior Water Well -->
  <ellipse cx="1060" cy="565" rx="300" ry="35" fill="#a7f3d0" opacity="0.75"/>
  <!-- Pure Still Crystal Bath Water Surface -->
  <ellipse cx="1060" cy="570" rx="280" ry="28" fill="#6ee7b7" opacity="0.8"/>

  <!-- Exposed Polished Brass Mixer Tap & Pipes -->
  <path d="M1060,420 L1060,545" stroke="url(#brassGold)" stroke-width="12" stroke-linecap="round"/>
  <path d="M1060,420 Q1060,390 1025,400 Q1010,410 1010,430" fill="none" stroke="url(#brassGold)" stroke-width="8" stroke-linecap="round"/>
  <!-- Hot & Cold Cross Handles -->
  <line x1="1040" y1="460" x2="1080" y2="460" stroke="url(#brassGold)" stroke-width="6"/>
  <circle cx="1035" cy="460" r="5" fill="#ffffff"/>
  <circle cx="1085" cy="460" r="5" fill="#ffffff"/>

  <!-- Vintage Brass Towel Rack on Left Wall -->
  <rect x="220" y="460" width="180" height="8" rx="4" fill="url(#brassGold)"/>
  <rect x="250" y="468" width="120" height="90" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="260" y="530" width="100" height="15" fill="#fde68a" opacity="0.6"/>

  <!-- Ample Open Standing Area on Center-Left Floor (for 81x87 player) -->
  <ellipse cx="500" cy="740" rx="180" ry="40" fill="#cbd5e1" opacity="0.3"/>
</svg>
