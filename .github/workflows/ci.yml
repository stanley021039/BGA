name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.platform }}-node22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PRs require Linux only; main pushes and manual runs also track Windows.
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"platform":"linux","os":"ubuntu-latest"}]' || '[{"platform":"linux","os":"ubuntu-latest"},{"platform":"windows","os":"windows-latest"}]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Verify tested commit
        env:
          EXPECTED_TEST_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node -e "const cp=require('node:child_process');const sha=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();console.log('Tested commit '+sha);if(sha!==process.env.EXPECTED_TEST_SHA)throw Error('CI checkout does not match requested commit');"
      - name: Install locked dependencies
        run: npm ci
      - name: Check source formatting
        run: npm run format:check
      - name: Check UI consistency ratchet
        env:
          UI_CHECK_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: npm run ui:check
      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend regressions
        run: npm --prefix frontend test
      - name: Run release check and full test suite
        run: npm test
