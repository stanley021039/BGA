<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="food-pizza">
            <rect width="400" height="300" rx="16" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- Pizza Plate / Wooden Board -->
            <circle cx="200" cy="150" r="120" fill="#E2E8F0" stroke="#141312" stroke-width="4"></circle>
            <!-- Whole Baked Pizza Crust -->
            <circle cx="200" cy="150" r="105" fill="#D97706" stroke="#141312" stroke-width="3.5"></circle>
            <!-- Cheese Layer with pulled slice effect -->
            <circle cx="200" cy="150" r="92" fill="#FEF08A" stroke="#141312" stroke-width="3"></circle>
            <!-- Pizza Slices cut lines -->
            <line x1="200" y1="58" x2="200" y2="242" stroke="#141312" stroke-width="2.5" stroke-dasharray="6 4"></line>
            <line x1="108" y1="150" x2="292" y2="150" stroke="#141312" stroke-width="2.5" stroke-dasharray="6 4"></line>
            <line x1="135" y1="85" x2="265" y2="215" stroke="#141312" stroke-width="2.5" stroke-dasharray="6 4"></line>
            <line x1="135" y1="215" x2="265" y2="85" stroke="#141312" stroke-width="2.5" stroke-dasharray="6 4"></line>
            <!-- Distinct Yellow Pineapple Chunks (Fan-shaped trapezoids with ridges) -->
            <!-- Pineapple 1 -->
            <path d="M165 95 L185 102 L178 122 L158 115 Z" fill="#FACC15" stroke="#141312" stroke-width="2.5"></path>
            <line x1="168" y1="102" x2="175" y2="115" stroke="#B45309" stroke-width="1.5"></line>
            <!-- Pineapple 2 -->
            <path d="M220 100 L240 110 L230 130 L210 120 Z" fill="#FACC15" stroke="#141312" stroke-width="2.5"></path>
            <line x1="223" y1="108" x2="228" y2="122" stroke="#B45309" stroke-width="1.5"></line>
            <!-- Pineapple 3 -->
            <path d="M140 155 L160 155 L158 175 L138 175 Z" fill="#FACC15" stroke="#141312" stroke-width="2.5"></path>
            <!-- Pineapple 4 -->
            <path d="M235 155 L255 160 L245 180 L225 175 Z" fill="#FACC15" stroke="#141312" stroke-width="2.5"></path>
            <!-- Pineapple 5 -->
            <path d="M185 185 L205 190 L195 210 L175 205 Z" fill="#FACC15" stroke="#141312" stroke-width="2.5"></path>
            <!-- Ham and herbs / basil leaves -->
            <circle cx="145" cy="130" r="10" fill="#F472B6" stroke="#141312" stroke-width="2"></circle>
            <circle cx="215" cy="155" r="11" fill="#F472B6" stroke="#141312" stroke-width="2"></circle>
            <circle cx="170" cy="150" r="9" fill="#F472B6" stroke="#141312" stroke-width="2"></circle>
            <circle cx="225" cy="195" r="10" fill="#F472B6" stroke="#141312" stroke-width="2"></circle>
            <!-- Green Basil leaves -->
            <ellipse cx="190" cy="130" rx="9" ry="5" fill="#16A34A" stroke="#141312" stroke-width="1.5" transform="rotate(25 190 130)"></ellipse>
            <ellipse cx="170" cy="180" rx="8" ry="4" fill="#16A34A" stroke="#141312" stroke-width="1.5" transform="rotate(-30 170 180)"></ellipse>
          </svg>