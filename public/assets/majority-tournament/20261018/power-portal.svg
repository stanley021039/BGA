<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="power-portal">
            <rect width="400" height="300" rx="16" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- Teleportation Portal Arch / Oval -->
            <ellipse cx="145" cy="150" rx="75" ry="105" fill="#38BDF8" fill-opacity="0.25" stroke="#0284C7" stroke-width="4.5"></ellipse>
            <ellipse cx="145" cy="150" rx="55" ry="85" fill="#C084FC" fill-opacity="0.3" stroke="#9333EA" stroke-width="3.5" stroke-dasharray="10 8"></ellipse>
            <ellipse cx="145" cy="150" rx="30" ry="55" fill="#141312"></ellipse>
            <!-- Stick Figure stepping one leg through -->
            <circle cx="145" cy="120" r="12" fill="#FACC15" stroke="#141312" stroke-width="2.5"></circle>
            <line x1="145" y1="132" x2="145" y2="165" stroke="#FACC15" stroke-width="4" stroke-linecap="round"></line>
            <line x1="145" y1="142" x2="125" y2="155" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round"></line>
            <line x1="145" y1="142" x2="165" y2="155" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round"></line>
            <!-- Left leg outside, right leg in portal -->
            <line x1="145" y1="165" x2="128" y2="195" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round"></line>
            <line x1="145" y1="165" x2="155" y2="185" stroke="#FACC15" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="4 4"></line>
            <!-- Energy Sparks around portal -->
            <path d="M85 90 L105 105 M205 100 L185 115 M90 205 L110 190 M200 195 L180 180" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"></path>
            <!-- Rigorous Battery / Remaining Uses Gauge right side -->
            <rect x="255" y="80" width="100" height="140" rx="16" fill="#F8FAFC" stroke="#141312" stroke-width="4"></rect>
            <!-- Battery top cap -->
            <rect x="285" y="65" width="40" height="15" rx="4" fill="#141312"></rect>
            <!-- Battery charge segments (Only 1 full, others empty/warning red) -->
            <rect x="270" y="95" width="70" height="28" rx="4" fill="#FCA5A5" stroke="#141312" stroke-width="2"></rect>
            <line x1="280" y1="109" x2="330" y2="109" stroke="#DC2626" stroke-width="3" stroke-dasharray="4 4"></line>
            <rect x="270" y="132" width="70" height="28" rx="4" fill="#E2E8F0" stroke="#141312" stroke-width="2"></rect>
            <rect x="270" y="169" width="70" height="38" rx="4" fill="#EF4444" stroke="#141312" stroke-width="2"></rect>
            <!-- Red Warning Exclamation inside remaining charge -->
            <circle cx="305" cy="182" r="3" fill="#FFFFFF"></circle>
            <line x1="305" y1="188" x2="305" y2="198" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></line>
          </svg>