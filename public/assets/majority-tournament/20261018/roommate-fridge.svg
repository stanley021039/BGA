<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="roommate-fridge">
            <rect width="400" height="300" rx="16" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- Open Refrigerator Door & Cold Interior -->
            <rect x="70" y="40" width="260" height="230" rx="14" fill="#E2E8F0" stroke="#141312" stroke-width="4"></rect>
            <rect x="85" y="55" width="230" height="200" rx="8" fill="#F0F9FF" stroke="#141312" stroke-width="3"></rect>
            <!-- Shelf separator -->
            <line x1="85" y1="150" x2="315" y2="150" stroke="#141312" stroke-width="3"></line>
            <!-- Top Shelf: Multiple Angry Sticky Notes -->
            <g transform="rotate(-6 130 90)">
              <rect x="110" y="70" width="48" height="48" rx="4" fill="#FEF08A" stroke="#141312" stroke-width="2.5"></rect>
              <line x1="118" y1="84" x2="150" y2="84" stroke="#141312" stroke-width="2.5"></line>
              <line x1="118" y1="94" x2="142" y2="94" stroke="#141312" stroke-width="2.5"></line>
            </g>
            <g transform="rotate(8 250 90)">
              <rect x="230" y="72" width="46" height="46" rx="4" fill="#FCA5A5" stroke="#141312" stroke-width="2.5"></rect>
              <!-- Skull / Warning cross -->
              <line x1="242" y1="85" x2="264" y2="105" stroke="#DC2626" stroke-width="3" stroke-linecap="round"></line>
              <line x1="264" y1="85" x2="242" y2="105" stroke="#DC2626" stroke-width="3" stroke-linecap="round"></line>
            </g>
            <!-- Bottom Shelf: Half-eaten strawberry cake slice with bite mark -->
            <path d="M120 220 L180 220 L150 170 Z" fill="#FBCFE8" stroke="#141312" stroke-width="3"></path>
            <!-- Cream top & bite marks -->
            <path d="M120 220 Q130 212 140 220 Q150 212 160 220 Q170 212 180 220" stroke="#141312" stroke-width="2.5" fill="#FFFFFF"></path>
            <!-- Jagged bite taken out -->
            <path d="M165 190 Q155 195 160 205 Q150 210 155 220" stroke="#141312" stroke-width="3" fill="#F0F9FF"></path>
            <!-- Half-drunk milk carton with bold red strikethrough label -->
            <rect x="220" y="175" width="55" height="75" rx="4" fill="#38BDF8" stroke="#141312" stroke-width="3"></rect>
            <polygon points="220,175 247,155 275,175" fill="#BAE6FD" stroke="#141312" stroke-width="3"></polygon>
            <!-- Name tag on milk -->
            <rect x="228" y="195" width="38" height="20" rx="3" fill="#FEF08A" stroke="#141312" stroke-width="2"></rect>
            <line x1="232" y1="205" x2="262" y2="205" stroke="#EF4444" stroke-width="3"></line>
          </svg>