<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="roommate-dishes">
            <rect width="400" height="300" rx="16" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- Kitchen Sink Outer and Basin -->
            <rect x="50" y="145" width="300" height="120" rx="14" fill="#E2E8F0" stroke="#141312" stroke-width="4"></rect>
            <rect x="65" y="160" width="270" height="90" rx="8" fill="#CBD5E1" stroke="#141312" stroke-width="2.5"></rect>
            <!-- Tall curved Faucet -->
            <path d="M210 70 V125" stroke="#64748B" stroke-width="9" stroke-linecap="round"></path>
            <path d="M210 70 A30 30 0 0 0 150 70 V105" fill="none" stroke="#64748B" stroke-width="9" stroke-linecap="round"></path>
            <!-- Dripping Water Drop -->
            <circle cx="150" cy="126" r="5" fill="#38BDF8" stroke="#141312" stroke-width="2"></circle>
            <!-- Gigantic precarious pile of oily dishes -->
            <ellipse cx="145" cy="235" rx="65" ry="15" fill="#94A3B8" stroke="#141312" stroke-width="3"></ellipse>
            <ellipse cx="145" cy="223" rx="60" ry="14" fill="#F59E0B" fill-opacity="0.3" stroke="#D97706" stroke-width="2.5"></ellipse>
            <ellipse cx="145" cy="211" rx="55" ry="13" fill="#EF4444" fill-opacity="0.25" stroke="#DC2626" stroke-width="2.5"></ellipse>
            <ellipse cx="146" cy="199" rx="50" ry="12" fill="#F8FAFC" stroke="#141312" stroke-width="2.5"></ellipse>
            <ellipse cx="143" cy="187" rx="44" ry="11" fill="#FEF08A" stroke="#141312" stroke-width="2.5"></ellipse>
            <ellipse cx="140" cy="175" rx="36" ry="9" fill="#38BDF8" fill-opacity="0.3" stroke="#0284C7" stroke-width="2.5"></ellipse>
            <!-- Tilted Bowl on top -->
            <path d="M120 165 Q140 185 160 165 Z" fill="#F472B6" stroke="#141312" stroke-width="2.5"></path>
            <!-- Sponge with green scouring pad -->
            <rect x="250" y="200" width="60" height="32" rx="6" fill="#FACC15" stroke="#141312" stroke-width="3"></rect>
            <rect x="250" y="222" width="60" height="10" rx="2" fill="#16A34A" stroke="#141312" stroke-width="1.5"></rect>
            <!-- Floating Stinky / soapy bubbles -->
            <circle cx="265" cy="178" r="9" fill="#93C5FD" fill-opacity="0.4" stroke="#141312" stroke-width="2"></circle>
            <circle cx="285" cy="166" r="6" fill="#93C5FD" fill-opacity="0.4" stroke="#141312" stroke-width="1.5"></circle>
            <circle cx="298" cy="182" r="4" fill="#93C5FD" fill-opacity="0.5" stroke="#141312" stroke-width="1.5"></circle>
            <!-- Stench wavy fumes -->
            <path d="M110 145 Q115 130 110 115" stroke="#84CC16" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
            <path d="M135 140 Q142 125 136 110" stroke="#84CC16" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
          </svg>