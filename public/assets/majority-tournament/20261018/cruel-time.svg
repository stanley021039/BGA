<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="cruel-time">
            <rect width="400" height="300" rx="16" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- Diverging Crossroads / Iron tracks -->
            <path d="M200 270 L200 170 L100 65" stroke="#141312" stroke-width="5" stroke-dasharray="10 8"></path>
            <path d="M200 270 L200 170 L300 65" stroke="#141312" stroke-width="5" stroke-dasharray="10 8"></path>
            <!-- Switch lever at fork -->
            <circle cx="200" cy="170" r="16" fill="#F59E0B" stroke="#141312" stroke-width="3"></circle>
            <line x1="200" y1="170" x2="185" y2="135" stroke="#141312" stroke-width="5" stroke-linecap="round"></line>
            <circle cx="185" cy="135" r="9" fill="#EF4444" stroke="#141312" stroke-width="2"></circle>
            <!-- Left Path Destination: Running Hourglass of Time -->
            <rect x="60" y="50" width="80" height="95" rx="12" fill="#E0F2FE" stroke="#141312" stroke-width="3.5"></rect>
            <!-- Hourglass inside -->
            <polygon points="80,65 120,65 100,95" fill="#38BDF8" stroke="#141312" stroke-width="2"></polygon>
            <polygon points="100,95 120,125 80,125" fill="#38BDF8" stroke="#141312" stroke-width="2"></polygon>
            <circle cx="100" cy="98" r="2" fill="#0284C7"></circle>
            <circle cx="100" cy="115" r="4" fill="#0284C7"></circle>
            <!-- Right Path Destination: Free Soaring Bird & Broken Cage -->
            <rect x="260" y="50" width="80" height="95" rx="12" fill="#FEF3C7" stroke="#141312" stroke-width="3.5"></rect>
            <!-- Open Bird Cage with broken bars -->
            <path d="M275 130 V95 A25 25 0 0 1 325 95 V130 Z" fill="none" stroke="#141312" stroke-width="2.5"></path>
            <line x1="290" y1="130" x2="290" y2="95" stroke="#141312" stroke-width="2"></line>
            <line x1="310" y1="130" x2="310" y2="105" stroke="#141312" stroke-width="2" stroke-linecap="round"></line>
            <!-- Bird flying free upward -->
            <path d="M295 75 Q305 60 315 75 Q325 60 335 75" fill="none" stroke="#EA580C" stroke-width="3" stroke-linecap="round"></path>
          </svg>