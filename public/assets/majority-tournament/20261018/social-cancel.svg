<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" aria-label="social-cancel">
            <rect width="400" height="300" rx="16" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- Cafe Round Table -->
            <ellipse cx="200" cy="220" rx="140" ry="42" fill="#E2E8F0" stroke="#141312" stroke-width="4"></ellipse>
            <path d="M195 220 V275" stroke="#141312" stroke-width="8" stroke-linecap="round"></path>
            <line x1="160" y1="275" x2="240" y2="275" stroke="#141312" stroke-width="6" stroke-linecap="round"></line>
            <!-- Single cup of coffee on left -->
            <rect x="130" y="180" width="30" height="32" rx="4" fill="#FFFFFF" stroke="#141312" stroke-width="2.5"></rect>
            <ellipse cx="145" cy="180" rx="15" ry="5" fill="#78350F" stroke="#141312" stroke-width="2"></ellipse>
            <path d="M160 190 H168 A6 6 0 0 1 174 196 V200 A6 6 0 0 1 168 206 H160" fill="none" stroke="#141312" stroke-width="2.5"></path>
