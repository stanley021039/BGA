            <rect x="245" y="125" width="45" height="65" rx="8" fill="#F1F5F9" fill-opacity="0.4" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 6"></rect>
            <path d="M245 190 L235 235 M290 190 L300 235" stroke="#94A3B8" stroke-width="3" stroke-dasharray="6 6"></path>
            <!-- Tumbleweed / Gust of wind blowing through -->
            <path d="M225 155 Q255 135 285 155 T320 145" stroke="#64748B" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
            <path d="M235 170 Q255 160 275 170" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round"></path>
            <!-- Delayed/Cancel message popup floating above table -->
            <rect x="135" y="55" width="135" height="52" rx="12" fill="#FCA5A5" fill-opacity="0.3" stroke="#EF4444" stroke-width="2.5"></rect>
            <circle cx="160" cy="81" r="11" fill="#EF4444"></circle>
            <path d="M160 76 V82 L164 85" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path>
            <line x1="180" y1="76" x2="250" y2="76" stroke="#EF4444" stroke-width="3" stroke-linecap="round"></line>
            <line x1="180" y1="87" x2="230" y2="87" stroke="#EF4444" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round"></line>
          </svg>