<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="toilet" width="100%" height="100%" fill="none"><title>每次放屁都有明顯氣味</title><desc>只能選一種永久出糗：每次放屁都有明顯氣味</desc>
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Water Sparkles & Clean Drops -->
            <path d="M 52 48 Q 58 38 64 48" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"></path>
            <circle cx="58" cy="56" r="3" fill="#38BDF8"></circle>
            <path d="M 180 52 Q 186 42 192 52" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"></path>
            <!-- Water Tank (Cistern) -->
            <rect x="74" y="28" width="50" height="55" rx="6" fill="#FFFFFF" stroke="#141312" stroke-width="3.5"></rect>
            <!-- Tank Lid -->
            <rect x="70" y="22" width="58" height="12" rx="4" fill="#BAE6FD" stroke="#141312" stroke-width="3"></rect>
            <!-- Flush Lever -->
            <circle cx="114" cy="38" r="4.5" fill="#E5A93C" stroke="#141312" stroke-width="2"></circle>
            <line x1="114" y1="38" x2="122" y2="44" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></line>
            <!-- Toilet Base Pedestal -->
            <path d="M 108 108 L 102 136 L 148 136 L 142 108 Z" fill="#F1F5F9" stroke="#141312" stroke-width="3"></path>
            <rect x="96" y="134" width="58" height="10" rx="3" fill="#E2E8F0" stroke="#141312" stroke-width="2.5"></rect>
            <!-- Toilet Bowl -->
            <path d="M 98 75 C 98 75 100 112 135 112 C 168 112 172 75 172 75 Z" fill="#FFFFFF" stroke="#141312" stroke-width="3.5"></path>
            <!-- Water inside bowl -->
            <ellipse cx="135" cy="84" rx="26" ry="10" fill="#38BDF8" stroke="#141312" stroke-width="2"></ellipse>
            <!-- Toilet Seat Ring -->
            <ellipse cx="134" cy="74" rx="34" ry="12" fill="#BAE6FD" stroke="#141312" stroke-width="3.5"></ellipse>
            <ellipse cx="134" cy="74" rx="20" ry="7" fill="#FDFBF7" stroke="#141312" stroke-width="2"></ellipse>
            <!-- Raised Open Toilet Lid -->
            <path d="M 92 28 C 92 28 88 74 100 74 L 100 28 Z" fill="#FBCFE8" stroke="#141312" stroke-width="3"></path>
          </svg>
