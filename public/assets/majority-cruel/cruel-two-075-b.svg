<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="brokenheart" role="img"><title>覺得不適合就結束關係</title><desc>伴侶坦白曾拍過成人作品，你會：覺得不適合就結束關係</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 左半心（低彩粉）向左傾斜分離 -->
            <g transform="translate(-14, 0)">
              <path d="M190 70 C140 30 75 75 80 135 C85 180 130 215 190 250 L190 210 L170 190 L195 160 L165 130 L190 100 Z" fill="#FBCFE8" stroke="#141312" stroke-width="4" stroke-linejoin="round"></path>
              <ellipse cx="120" cy="110" rx="18" ry="25" fill="#FFFFFF" fill-opacity="0.6"></ellipse>
              <!-- 縫合小線段或創口貼 -->
              <rect x="100" y="150" width="35" height="14" rx="4" transform="rotate(-25 100 150)" fill="#FDE047" stroke="#141312" stroke-width="2"></rect>
            </g>
            <!-- 右半心（低彩粉藍）向右傾斜分離 -->
            <g transform="translate(14, 0)">
              <path d="M210 70 C260 30 325 75 320 135 C315 180 270 215 210 250 L210 210 L190 190 L215 160 L185 130 L210 100 Z" fill="#BAE6FD" stroke="#141312" stroke-width="4" stroke-linejoin="round"></path>
              <ellipse cx="280" cy="110" rx="18" ry="25" fill="#FFFFFF" fill-opacity="0.6"></ellipse>
              <!-- 縫合小線段 -->
              <rect x="260" y="170" width="35" height="14" rx="4" transform="rotate(30 260 170)" fill="#FDE047" stroke="#141312" stroke-width="2"></rect>
            </g>
            <!-- 中間懸浮裂痕小火花碎片 -->
            <polygon points="200,85 204,95 214,97 205,103 207,112 200,106 193,112 195,103 186,97 196,95" fill="#E5A93C"></polygon>
            <polygon points="200,165 203,172 210,174 204,178 205,185 200,180 195,185 196,178 190,174 197,172" fill="#E5A93C"></polygon>
          </svg>
