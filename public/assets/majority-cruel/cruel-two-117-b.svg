<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="calendar" role="img"><title>透過幾次相處慢慢確認</title><desc>成年人的約會你較重視：透過幾次相處慢慢確認</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 日曆本體卡片 -->
            <rect x="80" y="60" width="240" height="190" rx="14" fill="#FFFFFF" stroke="#141312" stroke-width="4"></rect>
            <!-- 日曆上方頂部掛條（暖金） -->
            <path d="M80 74 C80 66 86 60 94 60 L306 60 C314 60 320 66 320 74 L320 115 L80 115 Z" fill="#E5A93C" stroke="#141312" stroke-width="3.5"></path>
            <!-- 兩個鐵環掛勾 -->
            <rect x="125" y="42" width="16" height="36" rx="8" fill="#141312"></rect>
            <rect x="255" y="42" width="16" height="36" rx="8" fill="#141312"></rect>
            <!-- 日曆內部格子網格（點狀與方塊，無文字） -->
            <rect x="105" y="135" width="35" height="28" rx="6" fill="#F1F5F9" stroke="#141312" stroke-width="2"></rect>
            <rect x="155" y="135" width="35" height="28" rx="6" fill="#F1F5F9" stroke="#141312" stroke-width="2"></rect>
            <rect x="205" y="135" width="35" height="28" rx="6" fill="#F1F5F9" stroke="#141312" stroke-width="2"></rect>
            <rect x="255" y="135" width="35" height="28" rx="6" fill="#BAE6FD" stroke="#141312" stroke-width="2"></rect>
            <!-- 第二排日曆格（特別醒目標註格：低彩粉） -->
            <rect x="105" y="175" width="35" height="28" rx="6" fill="#F1F5F9" stroke="#141312" stroke-width="2"></rect>
            <rect x="155" y="175" width="35" height="28" rx="6" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></rect>
            <!-- 在這個格子打星星符號標記 -->
            <polygon points="172,182 174,188 180,188 175,192 177,198 172,194 167,198 169,192 164,188 170,188" fill="#E5A93C"></polygon>
            <rect x="205" y="175" width="35" height="28" rx="6" fill="#F1F5F9" stroke="#141312" stroke-width="2"></rect>
            <rect x="255" y="175" width="35" height="28" rx="6" fill="#F1F5F9" stroke="#141312" stroke-width="2"></rect>
            <!-- 第三排日曆格 -->
            <rect x="105" y="215" width="35" height="22" rx="4" fill="#F1F5F9" stroke="#141312" stroke-width="1.5"></rect>
            <rect x="155" y="215" width="35" height="22" rx="4" fill="#F1F5F9" stroke="#141312" stroke-width="1.5"></rect>
            <rect x="205" y="215" width="35" height="22" rx="4" fill="#FDE047" stroke="#141312" stroke-width="2"></rect>
            <rect x="255" y="215" width="35" height="22" rx="4" fill="#F1F5F9" stroke="#141312" stroke-width="1.5"></rect>
          </svg>
