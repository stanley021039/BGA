<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="bed" role="img"><title>每晚坐在你床邊</title><desc>鬼只會在一個地方出現，你選：每晚坐在你床邊</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 臥室床頭板 -->
            <rect x="65" y="60" width="270" height="110" rx="12" fill="#E2E8F0" stroke="#141312" stroke-width="3.5"></rect>
            <line x1="125" y1="60" x2="125" y2="170" stroke="#CBD5E1" stroke-width="3"></line>
            <line x1="200" y1="60" x2="200" y2="170" stroke="#CBD5E1" stroke-width="3"></line>
            <line x1="275" y1="60" x2="275" y2="170" stroke="#CBD5E1" stroke-width="3"></line>
            <!-- 床架與床墊主體 -->
            <rect x="50" y="160" width="300" height="90" rx="10" fill="#F8FAFC" stroke="#141312" stroke-width="3.5"></rect>
            <!-- 兩顆柔軟枕頭（低彩粉與粉藍） -->
            <rect x="80" y="125" width="105" height="45" rx="10" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></rect>
            <path d="M95 145 Q132 155 170 145" stroke="#141312" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
            <rect x="215" y="125" width="105" height="45" rx="10" fill="#BAE6FD" stroke="#141312" stroke-width="3.5"></rect>
            <path d="M230 145 Q267 155 305 145" stroke="#141312" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
            <!-- 溫暖蓬鬆棉被與折角（暖金與摺疊線） -->
            <path d="M50 175 C50 165 70 160 110 160 L290 160 C330 160 350 165 350 175 L350 245 C350 250 345 252 340 252 L60 252 C55 252 50 250 50 245 Z" fill="#FDE047" stroke="#141312" stroke-width="3.5"></path>
            <path d="M50 190 Q200 215 350 190" stroke="#141312" stroke-width="3" fill="none"></path>
            <polygon points="50,175 120,175 90,205 50,195" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></polygon>
            <!-- 床腳 -->
            <rect x="65" y="250" width="18" height="25" rx="4" fill="#141312"></rect>
            <rect x="317" y="250" width="18" height="25" rx="4" fill="#141312"></rect>
          </svg>
