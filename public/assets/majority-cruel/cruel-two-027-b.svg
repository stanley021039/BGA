<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="ear" role="img"><title>先聽對方說再慢慢分享</title><desc>伴侶問起性幻想，你會：先聽對方說再慢慢分享</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 人耳輪廓主體（低彩粉） -->
            <path d="M120 70 C70 70 60 140 70 180 C80 220 120 245 140 245 C165 245 175 220 170 195 C165 170 145 160 145 140 C145 110 160 100 150 80 C145 72 135 70 120 70 Z" fill="#FBCFE8" stroke="#141312" stroke-width="4.5" stroke-linejoin="round"></path>
            <!-- 耳廓內折與耳珠細節 -->
            <path d="M120 100 C95 105 90 145 105 165 C115 178 135 175 130 150" stroke="#141312" stroke-width="3.5" fill="none" stroke-linecap="round"></path>
            <circle cx="145" cy="210" r="5" fill="#E5A93C"></circle>
            <!-- 向右擴散傳播的立體聲波弧線（粉藍與暖金，粗線條） -->
            <!-- 第一道聲波（小） -->
            <path d="M195 120 A50 50 0 0 1 195 180" stroke="#141312" stroke-width="5" stroke-linecap="round" fill="none"></path>
            <path d="M195 120 A50 50 0 0 1 195 180" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round" fill="none"></path>
            <!-- 第二道聲波（中） -->
            <path d="M235 95 A85 85 0 0 1 235 205" stroke="#141312" stroke-width="5.5" stroke-linecap="round" fill="none"></path>
            <path d="M235 95 A85 85 0 0 1 235 205" stroke="#BAE6FD" stroke-width="3" stroke-linecap="round" fill="none"></path>
            <!-- 第三道聲波（大） -->
            <path d="M280 70 A125 125 0 0 1 280 230" stroke="#141312" stroke-width="6" stroke-linecap="round" fill="none"></path>
            <path d="M280 70 A125 125 0 0 1 280 230" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <!-- 第四道聲波（最遠散點） -->
            <circle cx="330" cy="115" r="6" fill="#BAE6FD" stroke="#141312" stroke-width="2.5"></circle>
            <circle cx="340" cy="150" r="8" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></circle>
            <circle cx="330" cy="185" r="6" fill="#BAE6FD" stroke="#141312" stroke-width="2.5"></circle>
          </svg>
