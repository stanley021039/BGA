<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="crystal" role="img"><title>先知道未來一次危機</title><desc>如果有一次改寫人生的機會，你選：先知道未來一次危機</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 占卜台金色三角爪座 -->
            <ellipse cx="200" cy="245" rx="75" ry="18" fill="#E5A93C" stroke="#141312" stroke-width="3.5"></ellipse>
            <path d="M140 245 L160 185 L240 185 L260 245 Z" fill="#FDE047" stroke="#141312" stroke-width="3.5"></path>
            <circle cx="200" cy="215" r="8" fill="#FBCFE8" stroke="#141312" stroke-width="2"></circle>
            <!-- 水晶球主體球體（低彩粉藍） -->
            <circle cx="200" cy="130" r="78" fill="#BAE6FD" stroke="#141312" stroke-width="4.5"></circle>
            <!-- 球內魔幻發光星雲與旋渦（粉紅與暖金） -->
            <ellipse cx="200" cy="130" rx="55" ry="32" transform="rotate(-25 200 130)" fill="#FBCFE8" fill-opacity="0.7"></ellipse>
            <circle cx="190" cy="120" r="16" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <!-- 星芒與神秘粒子 -->
            <polygon points="215,95 218,102 225,103 219,107 221,114 215,110 209,114 211,107 205,103 212,102" fill="#FFFFFF"></polygon>
            <polygon points="175,145 177,150 182,151 178,154 179,159 175,156 171,159 172,154 168,151 173,150" fill="#FFFFFF"></polygon>
            <!-- 水晶球玻璃曲面大高光 -->
            <path d="M150 85 A65 65 0 0 1 230 75" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none"></path>
            <circle cx="242" cy="85" r="4" fill="#FFFFFF"></circle>
          </svg>
