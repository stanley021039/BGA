<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="law"><title>嚴格處罰已經犯罪的人</title><desc>你更願意支持哪種政策：嚴格處罰已經犯罪的人</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Impact shockwave stars & arcs -->
          <path d="M155 170 C145 155 140 140 140 125" stroke="#E5A93C" stroke-width="4" stroke-linecap="round"></path>
          <path d="M225 175 C240 160 250 145 250 130" stroke="#E5A93C" stroke-width="4" stroke-linecap="round"></path>
          <circle cx="130" cy="150" r="5" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
          <circle cx="260" cy="150" r="5" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
          <!-- Gavel Sound Block (Base) -->
          <rect x="120" y="220" width="160" height="30" rx="8" fill="#BAE6FD" stroke="#141312" stroke-width="4.5"></rect>
          <rect x="135" y="208" width="130" height="14" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="3.5"></rect>
          <!-- Tilted Gavel striking the block -->
          <g transform="rotate(-25 190 150)">
            <!-- Long Handle -->
            <rect x="183" y="25" width="14" height="135" rx="7" fill="#E5A93C" stroke="#141312" stroke-width="4"></rect>
            <!-- Handle Grip Rings -->
            <line x1="183" y1="40" x2="197" y2="40" stroke="#141312" stroke-width="3"></line>
            <line x1="183" y1="52" x2="197" y2="52" stroke="#141312" stroke-width="3"></line>
            <!-- Gavel Head (Pastel Pink cylinder) -->
            <rect x="135" y="140" width="110" height="48" rx="10" fill="#FBCFE8" stroke="#141312" stroke-width="4.5"></rect>
            <!-- Gold Brass Bands around gavel head -->
            <rect x="150" y="140" width="12" height="48" fill="#E5A93C" stroke="#141312" stroke-width="3"></rect>
            <rect x="218" y="140" width="12" height="48" fill="#E5A93C" stroke="#141312" stroke-width="3"></rect>
          </g>
        </svg>
