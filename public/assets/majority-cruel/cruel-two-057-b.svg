<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="party" width="100%" height="100%" fill="none"><title>大家笑著聊你的荒唐往事</title><desc>你的葬禮只能留下一種印象：大家笑著聊你的荒唐往事</desc>
            <!-- Background Fill for self-containment -->
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Party streamers -->
            <path d="M 28 32 Q 45 18 58 35 T 88 30" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <path d="M 180 28 Q 195 42 210 25 T 226 38" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <path d="M 145 18 Q 155 32 170 20" stroke="#34D399" stroke-width="3" stroke-linecap="round" fill="none"></path>
            <!-- Balloons strings -->
            <path d="M 85 86 Q 78 115 92 138" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></path>
            <path d="M 120 78 Q 124 105 118 138" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></path>
            <path d="M 155 86 Q 162 110 148 138" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></path>
            <!-- Left Pink Balloon -->
            <ellipse cx="85" cy="58" rx="26" ry="32" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></ellipse>
            <path d="M 72 42 A 18 24 0 0 1 82 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path>
            <polygon points="85,90 81,95 89,95" fill="#F472B6" stroke="#141312" stroke-width="2.5"></polygon>
            <!-- Right Blue Balloon -->
            <ellipse cx="155" cy="58" rx="26" ry="32" fill="#BAE6FD" stroke="#141312" stroke-width="3.5"></ellipse>
            <path d="M 142 42 A 18 24 0 0 1 152 32" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"></path>
            <polygon points="155,90 151,95 159,95" fill="#38BDF8" stroke="#141312" stroke-width="2.5"></polygon>
            <!-- Center Golden Main Balloon -->
            <ellipse cx="120" cy="50" rx="28" ry="34" fill="#FDE047" stroke="#141312" stroke-width="3.5"></ellipse>
            <path d="M 106 34 A 20 25 0 0 1 116 24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"></path>
            <polygon points="120,84 115,90 125,90" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></polygon>
            <!-- Confetti stars and circles -->
            <polygon points="45,95 48,102 55,102 49,106 51,113 45,109 39,113 41,106 35,102 42,102" fill="#E5A93C" stroke="#141312" stroke-width="2"></polygon>
            <polygon points="195,95 198,102 205,102 199,106 201,113 195,109 189,113 191,106 185,102 192,102" fill="#34D399" stroke="#141312" stroke-width="2"></polygon>
            <circle cx="58" cy="65" r="4.5" fill="#38BDF8" stroke="#141312" stroke-width="2"></circle>
            <circle cx="182" cy="72" r="4.5" fill="#F472B6" stroke="#141312" stroke-width="2"></circle>
            <circle cx="120" cy="142" r="3.5" fill="#E5A93C" stroke="#141312" stroke-width="2"></circle>
          </svg>
