<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="trash" width="100%" height="100%" fill="none"><title>永遠不用倒垃圾</title><desc>一輩子只能有一種生活便利：永遠不用倒垃圾</desc>
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Recycled / Discarded items flying -->
            <!-- Crumpled Paper -->
            <polygon points="62,38 72,32 78,42 70,50 58,46" fill="#FFFFFF" stroke="#141312" stroke-width="2"></polygon>
            <!-- Apple Core -->
            <path d="M 172 35 C 168 38 168 45 172 48 C 176 45 176 38 172 35 Z" fill="#F472B6" stroke="#141312" stroke-width="2"></path>
            <path d="M 172 33 L 175 28" stroke="#34D399" stroke-width="2" stroke-linecap="round"></path>
            <!-- Tilted / Floating Lid -->
            <g transform="rotate(-15 110 40)">
              <rect x="76" y="38" width="80" height="14" rx="4" fill="#34D399" stroke="#141312" stroke-width="3"></rect>
              <!-- Handle on lid -->
              <path d="M 106 38 V 28 C 106 25 126 25 126 28 V 38" fill="none" stroke="#141312" stroke-width="3" stroke-linecap="round"></path>
            </g>
            <!-- Main Bin Canister -->
            <path d="M 85 58 L 94 136 C 95 140 98 142 104 142 L 144 142 C 150 142 153 140 154 136 L 163 58 Z" fill="#BAE6FD" stroke="#141312" stroke-width="3.5"></path>
            <!-- Top Rim of Canister -->
            <ellipse cx="124" cy="58" rx="41" ry="8" fill="#FDE047" stroke="#141312" stroke-width="3"></ellipse>
            <!-- Vertical Texture Ribs on Bin -->
            <line x1="108" y1="72" x2="112" y2="128" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></line>
            <line x1="124" y1="72" x2="124" y2="128" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></line>
            <line x1="140" y1="72" x2="136" y2="128" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></line>
            <!-- Recycle Badge on Canister -->
            <circle cx="124" cy="98" r="10" fill="#FFFFFF" stroke="#141312" stroke-width="2"></circle>
            <path d="M 124 92 L 128 99 L 120 99 Z" fill="#34D399"></path>
          </svg>
