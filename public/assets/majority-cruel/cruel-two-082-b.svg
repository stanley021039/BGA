<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="crown" role="img"><title>普通學校中成績第一</title><desc>學校只能選一種競爭環境：普通學校中成績第一</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 皇冠基座天鵝絨底圈（低彩粉） -->
            <rect x="90" y="200" width="220" height="30" rx="8" fill="#FBCFE8" stroke="#141312" stroke-width="4"></rect>
            <!-- 基座鑲嵌寶石（粉藍與圓形） -->
            <circle cx="125" cy="215" r="7" fill="#BAE6FD" stroke="#141312" stroke-width="2"></circle>
            <circle cx="165" cy="215" r="7" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <circle cx="200" cy="215" r="9" fill="#EF4444" stroke="#141312" stroke-width="2"></circle>
            <circle cx="235" cy="215" r="7" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <circle cx="275" cy="215" r="7" fill="#BAE6FD" stroke="#141312" stroke-width="2"></circle>
            <!-- 皇冠主體五芒峰（暖金） -->
            <polygon points="90,200 70,105 135,145 200,70 265,145 330,105 310,200" fill="#FDE047" stroke="#141312" stroke-width="4" stroke-linejoin="round"></polygon>
            <!-- 皇冠陰影層次 -->
            <polygon points="135,145 200,70 200,200 135,200" fill="#E5A93C" stroke="#141312" stroke-width="2"></polygon>
            <polygon points="265,145 330,105 310,200 265,200" fill="#E5A93C" stroke="#141312" stroke-width="2"></polygon>
            <!-- 尖峰上的五顆大珍珠/寶珠 -->
            <circle cx="70" cy="105" r="14" fill="#BAE6FD" stroke="#141312" stroke-width="3"></circle>
            <circle cx="135" cy="145" r="11" fill="#FBCFE8" stroke="#141312" stroke-width="3"></circle>
            <circle cx="200" cy="70" r="16" fill="#FDFBF7" stroke="#141312" stroke-width="3.5"></circle>
            <circle cx="265" cy="145" r="11" fill="#FBCFE8" stroke="#141312" stroke-width="3"></circle>
            <circle cx="330" cy="105" r="14" fill="#BAE6FD" stroke="#141312" stroke-width="3"></circle>
          </svg>
