<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="hearts"><title>雙方願意的範圍內慢慢分享</title><desc>關於成年伴侶過去的親密經驗，你選：雙方願意的範圍內慢慢分享</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Sparkles & floating rings -->
          <circle cx="200" cy="60" r="8" fill="#FDE047" stroke="#141312" stroke-width="3"></circle>
          <path d="M85 100 L91 88 L97 100 L109 106 L97 112 L91 124 L85 112 L73 106 Z" fill="#BAE6FD" stroke="#141312" stroke-width="2.5"></path>
          <circle cx="320" cy="115" r="7" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></circle>
          <!-- Back / Right Heart (Pastel Blue, tilted right) -->
          <g transform="rotate(16 235 155)">
            <path d="M235 95 C215 60 160 65 160 125 C160 175 220 215 235 228 C250 215 310 175 310 125 C310 65 255 60 235 95 Z" fill="#BAE6FD" stroke="#141312" stroke-width="4.5" stroke-linejoin="round"></path>
            <path d="M185 105 C178 116 178 130 182 142" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path>
          </g>
          <!-- Front / Left Heart (Pastel Pink, tilted left, overlapping) -->
          <g transform="rotate(-14 165 170)">
            <path d="M165 100 C145 65 90 70 90 130 C90 180 150 220 165 235 C180 220 240 180 240 130 C240 70 185 65 165 100 Z" fill="#FBCFE8" stroke="#141312" stroke-width="4.5" stroke-linejoin="round"></path>
            <!-- Cute highlight -->
            <path d="M115 110 C108 122 108 136 112 148" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"></path>
            <!-- Warm Gold bow/pin linking them -->
            <circle cx="165" cy="140" r="9" fill="#E5A93C" stroke="#141312" stroke-width="3"></circle>
          </g>
        </svg>
