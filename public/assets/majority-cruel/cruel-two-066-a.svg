<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="city" role="img"><title>市中心迷你房間</title><desc>度假住宿只能選一個：市中心迷你房間</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 遠景城市高樓剪影 -->
            <rect x="50" y="110" width="45" height="150" fill="#CBD5E1"></rect>
            <rect x="85" y="80" width="55" height="180" fill="#94A3B8"></rect>
            <rect x="260" y="90" width="50" height="170" fill="#94A3B8"></rect>
            <rect x="300" y="120" width="50" height="140" fill="#CBD5E1"></rect>
            <!-- 小套房核心立面剖面（粉藍色調主建物） -->
            <rect x="130" y="55" width="140" height="205" rx="8" fill="#BAE6FD" stroke="#141312" stroke-width="4"></rect>
            <!-- 頂部水塔或天線 -->
            <rect x="155" y="40" width="25" height="15" rx="3" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></rect>
            <line x1="225" y1="35" x2="225" y2="55" stroke="#141312" stroke-width="3"></line>
            <!-- 三層樓窗格與生活暖光（暖黃/粉紅） -->
            <!-- 頂樓窗 -->
            <rect x="150" y="75" width="45" height="38" rx="4" fill="#FDE047" stroke="#141312" stroke-width="3"></rect>
            <line x1="172" y1="75" x2="172" y2="113" stroke="#141312" stroke-width="2"></line>
            <rect x="210" y="75" width="45" height="38" rx="4" fill="#FFFFFF" stroke="#141312" stroke-width="3"></rect>
            <!-- 二樓窗（掛盆栽小陽台） -->
            <rect x="150" y="130" width="45" height="38" rx="4" fill="#FFFFFF" stroke="#141312" stroke-width="3"></rect>
            <rect x="210" y="130" width="45" height="38" rx="4" fill="#FBCFE8" stroke="#141312" stroke-width="3"></rect>
            <rect x="205" y="158" width="55" height="14" rx="3" fill="#E5A93C" stroke="#141312" stroke-width="2"></rect>
            <circle cx="218" cy="154" r="5" fill="#22C55E"></circle>
            <circle cx="232" cy="154" r="6" fill="#16A34A"></circle>
            <!-- 一樓大門與玄關燈 -->
            <rect x="175" y="195" width="50" height="65" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="3.5"></rect>
            <circle cx="185" cy="230" r="4" fill="#141312"></circle>
            <circle cx="200" cy="188" r="5" fill="#FDE047"></circle>
          </svg>
