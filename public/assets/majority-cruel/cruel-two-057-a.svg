<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="coffin" role="img"><title>大家真心哭得很慘</title><desc>你的葬禮只能留下一種印象：大家真心哭得很慘</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 棺木陰影與基座 -->
            <ellipse cx="200" cy="255" rx="90" ry="15" fill="#E2E8F0"></ellipse>
            <!-- 棺木主體（經典六角形狀，低彩粉藍色調） -->
            <polygon points="175,45 225,45 270,105 240,250 160,250 130,105" fill="#BAE6FD" stroke="#141312" stroke-width="4" stroke-linejoin="round"></polygon>
            <!-- 棺蓋內嵌階梯層次（暖金金邊線條） -->
            <polygon points="180,60 220,60 255,110 230,235 170,235 145,110" fill="#F8FAFC" stroke="#141312" stroke-width="3" stroke-linejoin="round"></polygon>
            <!-- 裝飾幾何十字徽章（典雅金色，不恐怖） -->
            <rect x="193" y="90" width="14" height="50" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></rect>
            <rect x="180" y="105" width="40" height="14" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></rect>
            <!-- 兩側把手金屬飾扣 -->
            <circle cx="150" cy="150" r="6" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <circle cx="250" cy="150" r="6" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <circle cx="158" cy="195" r="6" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <circle cx="242" cy="195" r="6" fill="#FDE047" stroke="#141312" stroke-width="2"></circle>
            <!-- 象徵長眠的寧靜睡夢小月亮符號 -->
            <path d="M194 175 A15 15 0 0 0 206 195 A13 13 0 0 1 194 175 Z" fill="#FDE047" stroke="#141312" stroke-width="2"></path>
          </svg>
