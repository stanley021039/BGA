<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="home"><title>不用開口就有人分擔家事</title><desc>你最想被哪種方式愛著：不用開口就有人分擔家事</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
