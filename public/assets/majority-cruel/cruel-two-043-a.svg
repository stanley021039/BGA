<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="social" width="100%" height="100%" fill="none"><title>私訊變成公開貼文</title><desc>你最怕哪種社群翻車：私訊變成公開貼文</desc>
