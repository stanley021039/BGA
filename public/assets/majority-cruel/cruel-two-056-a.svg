<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="lamp"><title>頭上亮起一盞燈</title><desc>每次說謊都會露餡，你選：頭上亮起一盞燈</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Warm Light Beam Fan out -->
          <polygon points="175,130 90,260 270,260" fill="#FDE047" opacity="0.35"></polygon>
          <!-- Base of Lamp -->
          <ellipse cx="270" cy="255" rx="42" ry="12" fill="#BAE6FD" stroke="#141312" stroke-width="4.5"></ellipse>
          <!-- Switch button on base -->
          <circle cx="280" cy="253" r="5" fill="#E5A93C" stroke="#141312" stroke-width="2.5"></circle>
          <!-- Lamp Arm (Articulated Anglepoise) -->
          <!-- Lower Arm -->
          <line x1="270" y1="245" x2="240" y2="170" stroke="#141312" stroke-width="5" stroke-linecap="round"></line>
          <!-- Joint 1 -->
          <circle cx="240" cy="170" r="9" fill="#E5A93C" stroke="#141312" stroke-width="3.5"></circle>
          <!-- Upper Arm -->
          <line x1="240" y1="170" x2="185" y2="120" stroke="#141312" stroke-width="5" stroke-linecap="round"></line>
          <!-- Joint 2 -->
          <circle cx="185" cy="120" r="8" fill="#E5A93C" stroke="#141312" stroke-width="3.5"></circle>
          <!-- Lamp Shade (Pastel Pink Cone) -->
          <g transform="rotate(35 180 120)">
            <path d="M150 95 L210 95 L230 140 L130 140 Z" fill="#FBCFE8" stroke="#141312" stroke-width="4.5" stroke-linejoin="round"></path>
            <!-- Shade Rim -->
            <ellipse cx="180" cy="140" rx="50" ry="12" fill="#BAE6FD" stroke="#141312" stroke-width="3.5"></ellipse>
            <!-- Glowing bulb peek -->
            <circle cx="180" cy="138" r="14" fill="#FDE047"></circle>
          </g>
          <!-- Ground table line -->
          <line x1="60" y1="265" x2="340" y2="265" stroke="#141312" stroke-width="4.5" stroke-linecap="round"></line>
        </svg>
