<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="mirror"><title>每次照鏡子站在你身後</title><desc>鬼只會在一個地方出現，你選：每次照鏡子站在你身後</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Floating glint stars -->
          <path d="M100 80 L107 68 L114 80 L126 87 L114 94 L107 106 L100 94 L88 87 Z" fill="#FDE047" stroke="#141312" stroke-width="2.5"></path>
          <circle cx="295" cy="80" r="8" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></circle>
          <!-- Mirror Stand / Base -->
          <ellipse cx="200" cy="260" rx="55" ry="14" fill="#E5A93C" stroke="#141312" stroke-width="4.5"></ellipse>
          <!-- Vertical Support Pillar -->
          <rect x="193" y="195" width="14" height="65" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="4"></rect>
          <circle cx="200" cy="200" r="10" fill="#FBCFE8" stroke="#141312" stroke-width="3"></circle>
          <!-- Outer Mirror Frame (Warm Gold Oval) -->
          <ellipse cx="200" cy="120" rx="72" ry="92" fill="#E5A93C" stroke="#141312" stroke-width="5"></ellipse>
          <!-- Mirror Glass (Pastel Blue) -->
          <ellipse cx="200" cy="120" rx="58" ry="76" fill="#BAE6FD" stroke="#141312" stroke-width="4"></ellipse>
          <!-- Reflection Glare / Sheen -->
          <path d="M185 62 C215 70 238 95 245 125" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
          <circle cx="248" cy="142" r="4.5" fill="#FFFFFF"></circle>
          <path d="M160 120 C155 140 160 165 175 180" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"></path>
        </svg>
