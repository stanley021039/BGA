<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="screen" width="100%" height="100%" fill="none"><title>一起聊聊彼此喜好</title><desc>成年伴侶的看片偏好很特別，你會：一起聊聊彼此喜好</desc>
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Stand Base -->
            <path d="M 112 120 L 105 138 L 135 138 L 128 120 Z" fill="#E5A93C" stroke="#141312" stroke-width="3"></path>
            <rect x="94" y="136" width="52" height="10" rx="4" fill="#141312" stroke="#141312" stroke-width="2"></rect>
            <!-- Main Monitor Bezel -->
            <rect x="42" y="24" width="156" height="96" rx="10" fill="#141312" stroke="#141312" stroke-width="3.5"></rect>
            <!-- Screen Display Area -->
            <rect x="48" y="30" width="144" height="84" rx="6" fill="#BAE6FD" stroke="#141312" stroke-width="2"></rect>
            <!-- Code / Graph window elements inside monitor -->
            <rect x="56" y="38" width="55" height="42" rx="4" fill="#FFFFFF" stroke="#141312" stroke-width="2"></rect>
            <!-- Code lines -->
            <line x1="62" y1="46" x2="88" y2="46" stroke="#F472B6" stroke-width="2.5" stroke-linecap="round"></line>
            <line x1="62" y1="54" x2="102" y2="54" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"></line>
            <line x1="62" y1="62" x2="94" y2="62" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"></line>
            <line x1="62" y1="70" x2="82" y2="70" stroke="#E5A93C" stroke-width="2.5" stroke-linecap="round"></line>
            <!-- Graph Bars on Right -->
            <rect x="122" y="60" width="12" height="24" rx="3" fill="#FDE047" stroke="#141312" stroke-width="2"></rect>
            <rect x="140" y="48" width="12" height="36" rx="3" fill="#34D399" stroke="#141312" stroke-width="2"></rect>
            <rect x="158" y="36" width="12" height="48" rx="3" fill="#F472B6" stroke="#141312" stroke-width="2"></rect>
            <line x1="116" y1="84" x2="178" y2="84" stroke="#141312" stroke-width="2.5" stroke-linecap="round"></line>
            <!-- Bottom Dock / Status Line -->
            <rect x="56" y="92" width="128" height="14" rx="3" fill="#FEF3C7" stroke="#141312" stroke-width="1.5"></rect>
            <circle cx="64" cy="99" r="3" fill="#34D399"></circle>
            <circle cx="73" cy="99" r="3" fill="#FDE047"></circle>
            <circle cx="82" cy="99" r="3" fill="#F472B6"></circle>
