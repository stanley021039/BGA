<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="job"><title>保持沉默讓結果自己發生</title><desc>同事的失誤可能讓你升職，你選：保持沉默讓結果自己發生</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Desk Top Line -->
          <rect x="70" y="215" width="260" height="16" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="4"></rect>
          <!-- Desk Legs -->
          <line x1="100" y1="231" x2="100" y2="270" stroke="#141312" stroke-width="4.5" stroke-linecap="round"></line>
          <line x1="300" y1="231" x2="300" y2="270" stroke="#141312" stroke-width="4.5" stroke-linecap="round"></line>
          <!-- Briefcase Handle -->
          <path d="M175 105 C175 90 225 90 225 105" fill="none" stroke="#141312" stroke-width="4.5" stroke-linecap="round"></path>
          <!-- Briefcase Main Body (Pastel Blue & Gold corners) -->
          <rect x="135" y="105" width="130" height="95" rx="12" fill="#BAE6FD" stroke="#141312" stroke-width="4.5"></rect>
          <!-- Briefcase flap -->
          <path d="M135 105 L200 148 L265 105" fill="#BAE6FD" stroke="#141312" stroke-width="3.5" stroke-linejoin="round"></path>
          <!-- Gold Lock Clasp -->
          <rect x="188" y="142" width="24" height="20" rx="4" fill="#E5A93C" stroke="#141312" stroke-width="3"></rect>
          <circle cx="200" cy="151" r="2.5" fill="#141312"></circle>
          <!-- Horizontal Leather Straps -->
          <line x1="158" y1="105" x2="158" y2="200" stroke="#E5A93C" stroke-width="4"></line>
          <line x1="242" y1="105" x2="242" y2="200" stroke="#E5A93C" stroke-width="4"></line>
          <!-- Pen holder / cup on right side of desk -->
          <rect x="275" y="170" width="28" height="45" rx="5" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></rect>
          <!-- Pens / Ruler sticking out -->
          <line x1="284" y1="170" x2="278" y2="145" stroke="#141312" stroke-width="3" stroke-linecap="round"></line>
          <line x1="292" y1="170" x2="295" y2="140" stroke="#E5A93C" stroke-width="3.5" stroke-linecap="round"></line>
          <!-- Stack of docs on left side -->
          <rect x="85" y="195" width="38" height="20" rx="2" fill="#FDFBF7" stroke="#141312" stroke-width="2.5"></rect>
        </svg>
