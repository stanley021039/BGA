<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="candy" role="img"><title>所有食物都像橡皮糖</title><desc>一輩子只能吃一種極端口感：所有食物都像橡皮糖</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 旋轉包裝紙（左翼蝴蝶結形狀） -->
            <polygon points="140,150 70,95 60,150 70,205" fill="#BAE6FD" stroke="#141312" stroke-width="3.5" stroke-linejoin="round"></polygon>
            <line x1="75" y1="120" x2="130" y2="150" stroke="#141312" stroke-width="2.5"></line>
            <line x1="75" y1="180" x2="130" y2="150" stroke="#141312" stroke-width="2.5"></line>
            <!-- 旋轉包裝紙（右翼蝴蝶結形狀） -->
            <polygon points="260,150 330,95 340,150 330,205" fill="#BAE6FD" stroke="#141312" stroke-width="3.5" stroke-linejoin="round"></polygon>
            <line x1="325" y1="120" x2="270" y2="150" stroke="#141312" stroke-width="2.5"></line>
            <line x1="325" y1="180" x2="270" y2="150" stroke="#141312" stroke-width="2.5"></line>
            <!-- 糖果主體圓球（低彩粉與暖金） -->
            <circle cx="200" cy="150" r="70" fill="#FBCFE8" stroke="#141312" stroke-width="4"></circle>
            <!-- 糖果幾何螺旋彩帶花紋 -->
            <path d="M150 100 Q200 150 250 200" stroke="#FDE047" stroke-width="16" fill="none" stroke-linecap="round"></path>
            <path d="M150 100 Q200 150 250 200" stroke="#141312" stroke-width="3.5" fill="none"></path>
            <path d="M190 82 Q230 110 265 140" stroke="#E5A93C" stroke-width="10" fill="none"></path>
            <path d="M135 160 Q170 190 210 218" stroke="#E5A93C" stroke-width="10" fill="none"></path>
            <!-- 小顆裝飾小糖球浮空 -->
            <circle cx="95" cy="70" r="12" fill="#FDE047" stroke="#141312" stroke-width="2.5"></circle>
            <circle cx="305" cy="235" r="14" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></circle>
          </svg>
