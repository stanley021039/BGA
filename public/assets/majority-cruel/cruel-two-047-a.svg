<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="voice" width="100%" height="100%" fill="none"><title>提醒服務生換回來</title><desc>餐廳送錯了你喜歡的菜，你選：提醒服務生換回來</desc>
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Sound waves radiating to the right -->
            <path d="M 148 55 A 32 32 0 0 1 148 95" stroke="#E5A93C" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <path d="M 166 42 A 52 52 0 0 1 166 108" stroke="#F472B6" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <path d="M 184 30 A 72 72 0 0 1 184 120" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <!-- Musical notes floating -->
            <circle cx="198" cy="45" r="4.5" fill="#34D399" stroke="#141312" stroke-width="2"></circle>
            <path d="M 202 45 V 28 L 214 32 V 48" stroke="#141312" stroke-width="2"></path>
            <circle cx="212" cy="48" r="4" fill="#34D399" stroke="#141312" stroke-width="2"></circle>
            <!-- Microphone Stand -->
            <line x1="102" y1="105" x2="102" y2="135" stroke="#141312" stroke-width="4" stroke-linecap="round"></line>
            <ellipse cx="102" cy="136" rx="25" ry="6" fill="#E5A93C" stroke="#141312" stroke-width="3"></ellipse>
            <!-- U-shaped cradle holder -->
            <path d="M 76 60 C 76 96 128 96 128 60" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <!-- Microphone Capsule Body -->
            <rect x="86" y="32" width="32" height="48" rx="16" fill="#FDE047" stroke="#141312" stroke-width="3.5"></rect>
            <!-- Mic Mesh Grille lines -->
            <line x1="86" y1="48" x2="118" y2="48" stroke="#141312" stroke-width="2.5"></line>
            <line x1="86" y1="56" x2="118" y2="56" stroke="#141312" stroke-width="2.5"></line>
            <line x1="102" y1="32" x2="102" y2="56" stroke="#141312" stroke-width="2"></line>
            <!-- Power indicator light -->
            <circle cx="102" cy="68" r="3" fill="#34D399"></circle>
          </svg>
