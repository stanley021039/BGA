<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" aria-label="bug" role="img"><title>超怕蟑螂</title><desc>全部朋友知道你一個弱點：超怕蟑螂</desc>
            <rect width="400" height="300" rx="14" fill="#FDFBF7" stroke="#141312" stroke-width="4"></rect>
            <!-- 昆蟲六隻可愛關節腳 -->
            <path d="M140 130 Q90 100 80 80" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <path d="M130 160 Q70 160 65 170" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <path d="M140 190 Q90 215 85 240" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <path d="M260 130 Q310 100 320 80" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <path d="M270 160 Q330 160 335 170" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <path d="M260 190 Q310 215 315 240" stroke="#141312" stroke-width="4" stroke-linecap="round" fill="none"></path>
            <!-- 身體主甲殼（粉藍與圓形） -->
            <ellipse cx="200" cy="175" rx="65" ry="75" fill="#BAE6FD" stroke="#141312" stroke-width="4"></ellipse>
            <!-- 甲殼中央分界縫隙 -->
            <line x1="200" y1="105" x2="200" y2="250" stroke="#141312" stroke-width="3.5"></line>
            <!-- 甲殼可愛暖金與粉紅斑點 -->
            <circle cx="165" cy="155" r="14" fill="#FDE047" stroke="#141312" stroke-width="2.5"></circle>
            <circle cx="235" cy="155" r="14" fill="#FDE047" stroke="#141312" stroke-width="2.5"></circle>
            <circle cx="165" cy="205" r="12" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></circle>
            <circle cx="235" cy="205" r="12" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></circle>
            <!-- 頭部與大眼睛 -->
            <circle cx="200" cy="100" r="32" fill="#E5A93C" stroke="#141312" stroke-width="4"></circle>
            <!-- 眼睛 -->
            <circle cx="185" cy="95" r="8" fill="#FFFFFF" stroke="#141312" stroke-width="2"></circle>
            <circle cx="187" cy="95" r="4" fill="#141312"></circle>
            <circle cx="215" cy="95" r="8" fill="#FFFFFF" stroke="#141312" stroke-width="2"></circle>
            <circle cx="213" cy="95" r="4" fill="#141312"></circle>
            <!-- 可愛雙天線觸角 -->
            <path d="M185 75 Q160 40 145 45" stroke="#141312" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <circle cx="145" cy="45" r="5" fill="#E5A93C" stroke="#141312" stroke-width="2"></circle>
            <path d="M215 75 Q240 40 255 45" stroke="#141312" stroke-width="3.5" stroke-linecap="round" fill="none"></path>
            <circle cx="255" cy="45" r="5" fill="#E5A93C" stroke="#141312" stroke-width="2"></circle>
          </svg>
