<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="scale" width="100%" height="100%" fill="none"><title>相同工作卻待遇不同</title><desc>職場不公平只能先處理一件：相同工作卻待遇不同</desc>
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Base Stand -->
            <polygon points="120,55 106,132 134,132" fill="#E5A93C" stroke="#141312" stroke-width="3"></polygon>
            <rect x="92" y="130" width="56" height="12" rx="4" fill="#141312" stroke="#141312" stroke-width="2"></rect>
            <!-- Fulcrum Center Circle -->
            <circle cx="120" cy="55" r="7" fill="#FDE047" stroke="#141312" stroke-width="3"></circle>
            <!-- Balance Beam tilted slightly -->
            <line x1="52" y1="48" x2="188" y2="62" stroke="#141312" stroke-width="4.5" stroke-linecap="round"></line>
            <!-- Left Pan Strings & Pan (Higher / lighter) -->
            <line x1="54" y1="48" x2="38" y2="84" stroke="#141312" stroke-width="2"></line>
            <line x1="54" y1="48" x2="70" y2="84" stroke="#141312" stroke-width="2"></line>
            <path d="M 32 84 C 32 98 76 98 76 84 Z" fill="#BAE6FD" stroke="#141312" stroke-width="3"></path>
            <!-- Item on left pan: Sparkling Heart -->
            <path d="M 54 75 C 50 68 42 70 44 76 C 46 82 54 85 54 85 C 54 85 62 82 64 76 C 66 70 58 68 54 75 Z" fill="#F472B6" stroke="#141312" stroke-width="2"></path>
            <!-- Right Pan Strings & Pan (Lower / heavier) -->
            <line x1="186" y1="62" x2="170" y2="98" stroke="#141312" stroke-width="2"></line>
            <line x1="186" y1="62" x2="202" y2="98" stroke="#141312" stroke-width="2"></line>
            <path d="M 164 98 C 164 112 208 112 208 98 Z" fill="#FDE047" stroke="#141312" stroke-width="3"></path>
            <!-- Item on right pan: Stacked Golden Coins -->
            <ellipse cx="186" cy="96" rx="14" ry="4" fill="#E5A93C" stroke="#141312" stroke-width="2"></ellipse>
            <ellipse cx="186" cy="90" rx="14" ry="4" fill="#E5A93C" stroke="#141312" stroke-width="2"></ellipse>
            <ellipse cx="186" cy="84" rx="14" ry="4" fill="#FDE047" stroke="#141312" stroke-width="2"></ellipse>
          </svg>
