<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="gift"><title>對方安排好每個驚喜</title><desc>約會時你比較心動：對方安排好每個驚喜</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Decorative dots / stars -->
          <circle cx="90" cy="110" r="6" fill="#FDE047" stroke="#141312" stroke-width="2.5"></circle>
          <circle cx="310" cy="120" r="7" fill="#BAE6FD" stroke="#141312" stroke-width="2.5"></circle>
          <!-- Ribbon Bows at top -->
          <!-- Left loop -->
          <path d="M195 95 C160 50 120 70 145 105 C165 115 190 102 195 95 Z" fill="#FBCFE8" stroke="#141312" stroke-width="4"></path>
          <!-- Right loop -->
          <path d="M205 95 C240 50 280 70 255 105 C235 115 210 102 205 95 Z" fill="#FBCFE8" stroke="#141312" stroke-width="4"></path>
          <!-- Bow Knot -->
          <circle cx="200" cy="98" r="14" fill="#E5A93C" stroke="#141312" stroke-width="4"></circle>
          <!-- Hanging ribbons -->
          <path d="M190 105 C175 125 160 135 150 150" stroke="#141312" stroke-width="4" stroke-linecap="round"></path>
          <path d="M210 105 C225 125 240 135 250 150" stroke="#141312" stroke-width="4" stroke-linecap="round"></path>
          <!-- Gift Lid -->
          <rect x="110" y="105" width="180" height="38" rx="7" fill="#E5A93C" stroke="#141312" stroke-width="4.5"></rect>
          <!-- Lid Ribbon -->
          <rect x="185" y="105" width="30" height="38" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></rect>
          <!-- Gift Body -->
          <rect x="125" y="143" width="150" height="110" rx="6" fill="#BAE6FD" stroke="#141312" stroke-width="4.5"></rect>
          <!-- Vertical Body Ribbon -->
          <rect x="185" y="143" width="30" height="110" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></rect>
          <!-- Horizontal Body Ribbon -->
          <rect x="125" y="185" width="150" height="24" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></rect>
          <!-- Center ribbon cross patch -->
          <rect x="185" y="185" width="30" height="24" fill="#E5A93C" stroke="#141312" stroke-width="3"></rect>
        </svg>
