<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none" aria-label="lock"><title>先從雙方已熟悉的方式調整</title><desc>成年伴侶想嘗試新鮮事，你選：先從雙方已熟悉的方式調整</desc>
          <rect width="400" height="300" rx="14" fill="#FDFBF7"></rect>
          <!-- Little security sparkles -->
          <path d="M100 95 L106 82 L112 95 L125 101 L112 107 L106 120 L100 107 L87 101 Z" fill="#FDE047" stroke="#141312" stroke-width="2.5"></path>
          <circle cx="300" cy="100" r="7" fill="#FBCFE8" stroke="#141312" stroke-width="2.5"></circle>
          <!-- Shackle (Heavy metal curved loop) -->
          <path d="M150 145 V100 C150 68 172 45 200 45 C228 45 250 68 250 100 V145" fill="none" stroke="#BAE6FD" stroke-width="22" stroke-linecap="round"></path>
          <path d="M150 145 V100 C150 68 172 45 200 45 C228 45 250 68 250 100 V145" fill="none" stroke="#141312" stroke-width="5" stroke-linecap="round"></path>
          <!-- Lock Body (Warm Gold rounded rectangle) -->
          <rect x="125" y="130" width="150" height="125" rx="24" fill="#E5A93C" stroke="#141312" stroke-width="5"></rect>
          <!-- Inner Plate (Pastel Pink badge) -->
          <rect x="145" y="150" width="110" height="85" rx="14" fill="#FBCFE8" stroke="#141312" stroke-width="3.5"></rect>
          <!-- Keyhole -->
          <circle cx="200" cy="180" r="13" fill="#141312"></circle>
          <polygon points="194,182 206,182 209,208 191,208" fill="#141312"></polygon>
          <circle cx="200" cy="179" r="4" fill="#FDFBF7"></circle>
        </svg>
