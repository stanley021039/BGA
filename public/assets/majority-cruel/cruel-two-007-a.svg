<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" aria-label="shirt" width="100%" height="100%" fill="none"><title>衣服有味道</title><desc>出門約會你最不能接受：衣服有味道</desc>
            <rect width="240" height="160" rx="10" fill="#FDFBF7"></rect>
            <!-- Hanger on top -->
            <path d="M 120 18 C 125 18 130 22 126 27 C 122 32 118 32 120 38 L 120 44" stroke="#141312" stroke-width="2.5" stroke-linecap="round" fill="none"></path>
            <path d="M 85 54 L 120 40 L 155 54" stroke="#E5A93C" stroke-width="3" stroke-linecap="round"></path>
            <!-- Main T-Shirt Body -->
            <path d="M 96 42 C 105 48 135 48 144 42 L 182 56 L 168 85 L 152 78 L 152 136 L 88 136 L 88 78 L 72 85 L 58 56 Z" fill="#FBCFE8" stroke="#141312" stroke-width="3.5" stroke-linejoin="round"></path>
