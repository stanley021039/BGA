            <path d="M 96 42 C 104 54 136 54 144 42" stroke="#141312" stroke-width="3" fill="#FEF3C7"></path>
            <!-- Cute Pocket with green sprout -->
            <rect x="98" y="70" width="22" height="24" rx="4" fill="#FDE047" stroke="#141312" stroke-width="2.5"></rect>
            <!-- Sprout / Flower -->
            <path d="M 109 70 C 109 64 104 62 104 62 C 104 62 108 67 109 70 Z" fill="#34D399" stroke="#141312" stroke-width="1.5"></path>
            <path d="M 109 70 C 109 64 114 62 114 62 C 114 62 110 67 109 70 Z" fill="#34D399" stroke="#141312" stroke-width="1.5"></path>
            <!-- Sleeve Stitching -->
            <line x1="72" y1="85" x2="88" y2="78" stroke="#141312" stroke-width="2"></line>
            <line x1="168" y1="85" x2="152" y2="78" stroke="#141312" stroke-width="2"></line>
            <!-- Hem detail -->
            <line x1="94" y1="128" x2="146" y2="128" stroke="#F472B6" stroke-width="2.5" stroke-dasharray="4 3"></line>
          </svg>
