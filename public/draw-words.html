<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你畫我猜共編題庫｜Afterhours</title><link rel="stylesheet" href="/draw.css"><link rel="stylesheet" href="/shared/site-header.css"></head>
<body><div class="draw-shell"><header class="site-header" data-site-header aria-label="網站導覽"><nav class="site-links" aria-label="主要導覽" hidden><a href="/community?tab=issues">留言板</a><details><summary>遊戲題庫</summary><div class="site-submenu"><a href="/community?tab=questions">同頻俱樂部</a><a href="/gifts">送禮達人</a></div></details><a href="/history">對局歷史</a></nav><a class="site-title" href="/">302捉猶團</a><div class="site-account" hidden><button id="site-account-button" class="site-avatar-button" type="button" aria-label="帳號選單" aria-expanded="false" aria-controls="site-account-menu"><img id="site-avatar" alt="我的頭像"></button><span id="site-account-id" class="site-account-id" aria-hidden="true"></span><div id="site-account-menu" class="site-account-menu" hidden><a href="/settings">形象設定</a><a href="/collection">收藏庫</a><a href="/achievements">成就收藏冊</a><button id="site-logout" type="button">登出</button></div></div><p id="site-header-error" role="status"></p></header>
<main class="words-layout"><section class="card"><span class="eyebrow">ADD A WORD</span><h1>留一個畫得出來的題目。</h1><p>好友投稿會加入選題池。題目與別名在遊戲揭曉前只給畫者看。</p>
<form id="wordForm"><label>題目（最多 24 字）<input name="title" maxlength="24" required placeholder="例如：腳踏車"></label><label>可接受別名（最多 5 個，以逗號分隔）<input name="aliases" placeholder="例如：自行車，單車"></label>
<fieldset><legend>題材</legend><div class="option-row">
<label><input type="radio" name="topic" value="food" required><span>食物飲料</span></label><label><input type="radio" name="topic" value="animals"><span>動物生物</span></label><label><input type="radio" name="topic" value="transport"><span>交通工具</span></label><label><input type="radio" name="topic" value="objects"><span>生活物品</span></label><label><input type="radio" name="topic" value="people"><span>人物職業</span></label><label><input type="radio" name="topic" value="nature"><span>自然奇幻</span></label><label><input type="radio" name="topic" value="places"><span>場所娛樂</span></label><label><input type="radio" name="topic" value="activities"><span>運動音樂</span></label><label><input type="radio" name="topic" value="misc"><span>綜合</span></label>
</div></fieldset><fieldset><legend>難度</legend><div class="option-row"><label><input type="radio" name="difficulty" value="easy" checked><span>簡單</span></label><label><input type="radio" name="difficulty" value="medium"><span>一般</span></label><label><input type="radio" name="difficulty" value="hard"><span>挑戰</span></label></div></fieldset><button class="button wide">加入好友題庫 →</button></form><p id="wordStatus" role="status"></p></section>
<section class="card"><span class="eyebrow">THE WORD BANK</span><h2>大家的題目</h2><p id="wordCount"></p><div id="wordList" class="word-list"></div></section></main></div><script src="/shared/motion-policy.js"></script><script src="/shared/audio-settings.js"></script><script src="/shared/popovers.js"></script><script src="/draw-words.js"></script><script src="/shared/site-header.js"></script></body></html>
