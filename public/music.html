<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共用音樂庫｜Afterhours</title><link rel="stylesheet" href="/club.css"><link rel="stylesheet" href="/shared/table-music.css"></head><body><header class="club-header"><a href="/">← 遊戲大廳</a><strong>AFTERHOURS / 共用音樂庫</strong></header><main class="music-library"><h1>選一首，陪朋友玩。</h1><p>上傳後所有已登入會員都能收聽，房主可在任一遊戲桌選曲。每首最多 20 MB，每人最多 20 首。</p><form id="music-upload"><label>曲名<input id="upload-title" maxlength="80" required placeholder="這首歌叫什麼？"></label><label>音樂檔案<input id="upload-file" type="file" accept=".mp3,.m4a,.ogg,audio/mpeg,audio/mp4,audio/ogg" required></label><p>支援 MP3、M4A、OGG。請分享你有權公開播放的音樂。</p><button class="button orange" id="upload-button">上傳到共用音樂庫</button><p id="upload-message" role="status"></p></form><h2>大家的音樂 <span id="music-count"></span></h2><input id="music-search" placeholder="搜尋曲名或上傳者" aria-label="搜尋音樂"><p id="library-message" role="status"></p><div id="music-list"></div></main><script src="/music.js"></script></body></html>
