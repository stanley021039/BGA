<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共用音樂庫｜Afterhours</title><link rel="stylesheet" href="/club.css"><link rel="stylesheet" href="/shared/table-music.css"><link rel="stylesheet" href="/shared/site-header.css"><link rel="stylesheet" href="/shared/ui-primitives.css"></head><body><header class="site-header" data-site-header aria-label="網站導覽"><nav class="site-links" aria-label="主要導覽" hidden><a href="/community?tab=issues">留言板</a><details><summary>遊戲題庫</summary><div class="site-submenu"><a href="/community?tab=questions">同頻俱樂部</a><a href="/gifts">送禮達人</a></div></details><a href="/history">對局歷史</a></nav><a class="site-title" href="/">302捉猶團</a><div class="site-account" hidden><button id="site-account-button" class="site-avatar-button" type="button" aria-label="帳號選單" aria-expanded="false" aria-controls="site-account-menu"><img id="site-avatar" alt="我的頭像"></button><span id="site-account-id" class="site-account-id" aria-hidden="true"></span><div id="site-account-menu" class="site-account-menu" hidden><a href="/settings">形象設定</a><a href="/collection">收藏庫</a><a href="/achievements">成就收藏冊</a><button id="site-logout" type="button">登出</button></div></div><p id="site-header-error" role="status"></p></header><main class="music-library"><h1>選一首，陪朋友玩。</h1><p>上傳後所有已登入會員都能收聽，同房玩家都可在遊戲桌選曲播放。每首最多 20 MB，每人最多 20 首。</p><form id="music-upload"><label>曲名<input id="upload-title" maxlength="80" required placeholder="這首歌叫什麼？"></label><label>音樂檔案<input id="upload-file" type="file" accept=".mp3,.m4a,.ogg,audio/mpeg,audio/mp4,audio/ogg" required></label><p>支援 MP3、M4A、OGG。請分享你有權公開播放的音樂。</p><button class="button orange" id="upload-button">上傳到共用音樂庫</button><p id="upload-message" role="status"></p></form><h2>大家的音樂 <span id="music-count"></span></h2><input id="music-search" placeholder="搜尋曲名或上傳者" aria-label="搜尋音樂"><p id="library-message" role="status"></p><div id="music-list"></div></main><script src="/s
