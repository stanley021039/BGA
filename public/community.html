<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>朋友共編｜Afterhours</title><link rel="stylesheet" href="/majority.css"><link rel="stylesheet" href="/community.css"></head><body><div class="shell"><header><a class="brand" href="/">◒ AFTERHOURS</a><nav><a class="quiet" href="/">回大廳 ↗</a><a class="quiet" href="/community?tab=issues">留言板</a><a class="quiet" href="/community?tab=questions">共用題庫</a></nav></header><main class="community-main"><div class="eyebrow">MADE BY FRIENDS</div><h1 id="pageTitle">朋友共編</h1><p id="pageIntro"></p><div class="tabs"><button id="issuesTab">留言板</button><button id="questionsTab">自選題庫</button></div><section class="card"><label for="nickname">登入暱稱</label><input id="nickname" maxlength="16" placeholder="朋友怎麼稱呼你？"><form id="issueForm" hidden><div class="fields"><div><label for="issueTitle">標題</label><input id="issueTitle" required maxlength="100" placeholder="問題、建議、想玩的新功能"></div><div><label for="issueGame">遊戲標籤</label><select id="issueGame"><option value="general">大廳／其他</option><option value="majority">同頻俱樂部</option><option value="thunder">雷霆之路</option><option value="poker">德州撲克</option></select></div></div><label for="issueBody">內容</label><textarea id="issueBody" required maxlength="3000" placeholder="發生了什麼？希望怎麼調整？"></textarea><p class="small">送出後，標題與內容會公開到 stanley021039/BGA 的 GitHub Issues。</p><button class="button wide">建立留言 →</button></form><form id="questionForm" hidden><div class="fields"><div><label for="pack">題庫名稱</label><input id="pack" maxlength="40" required value="朋友共編" placeholder="例如：我們的下班日常"></div><div><label for="questionTopic">分類</label><select id="questionTopic"></select></div></div><label for="questionType">題型</label><select id="questionType"><option value="two">二選一</option><option value="three">三選一</option><option value="blank">填空題</option></select><label for="questionPrompt">題目</label><textarea id="questionPrompt" required maxlength="160"></textarea><div id="questionOptions"></div><button class="button wide">加入共用題庫 →</button><p class="small">不設定標準答案。新增的題目會保存於主機，所有朋友都能挑選或隨機抽到。</p></form></section><section class="browse"><div class="fields"><input id="search" placeholder="搜尋標題、題目或題庫名稱" aria-label="搜尋"><select id="filter" aria-label="分類篩選"></select></div><p class="small" id="resultCount"></p><div id="items"></div><button class="button outline" id="more" hidden>載入更多</button></section></main></div><div id="toast" hidden role="status"></div><script src="/community.js"></script></body></html>
