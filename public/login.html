<!doctype html>
<html lang="zh-Hant">
<head><script src="/shared/color-scheme.js"></script>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>登入｜302捉猶團</title>
 <link rel="stylesheet" href="/club.css"><link rel="stylesheet" href="/club-pages.css">
<link rel="stylesheet" href="/shared/site-header.css"><link rel="stylesheet" href="/shared/ui-primitives.css"><link rel="stylesheet" href="/shared/barrage-frames.css"><link rel="stylesheet" href="/shared/playful-theme.css"></head>
<body data-visual-theme="playful" class="club-page auth-page">
 <div class="club">
  <header class="site-header" data-site-header aria-label="網站導覽"><nav class="site-links" aria-label="主要導覽" hidden><a href="/community?tab=issues">留言板</a><details><summary>遊戲題庫</summary><div class="site-submenu"><a href="/community?tab=questions">同頻俱樂部</a><a href="/gifts">送禮達人</a></div></details><a href="/history">對局歷史</a></nav><a class="site-title" href="/">302捉猶團</a><div class="site-account" hidden><button id="site-account-button" class="site-avatar-button" type="button" aria-label="帳號選單" aria-expanded="false" aria-controls="site-account-menu"><img id="site-avatar" alt="我的頭像"></button><span id="site-account-id" class="site-account-id" aria-hidden="true"></span><div id="site-account-menu" class="site-account-menu" hidden><a href="/settings">形象設定</a><a href="/collection">收藏庫</a><a href="/achievements">成就收藏冊</a><button id="site-logout" type="button">登出</button></div></div><p id="site-header-error" role="status"></p></header>
  <main class="auth-layout">
   <section class="auth-story" aria-label="Afterhours 俱樂部介紹">
    <div class="kicker">YOUR TABLE. YOUR PEOPLE.</div>
    <h1>好朋友，<br><em>好牌局。</em></h1>
    <p>在同一張桌上，把今晚留給朋友。登入後選個遊戲、開一間房，故事就從這裡開始。</p>
    <div class="auth-deck" aria-hidden="true"><img class="auth-deck-card auth-deck-left" src="/assets/playful/game-poker.svg" alt=""><img class="auth-deck-card auth-deck-middle" src="/assets/playful/game-thunder.svg" alt=""><img class="auth-deck-card auth-deck-right" src="/assets/playful/game-majority.svg" alt=""><span class="auth-deck-label">朋友就位，好戲開桌。</span></div><div class="auth-points"><span>德州撲克</span><span>雷霆之路</span><span>同頻俱樂部</span><span>送禮達人</span><span>你畫我猜</span><span>股市冥燈</span></div>
   </section>
   <section class="auth-card" aria-label="會員登入與註冊">
    <div class="card-topline"><span class="card-symbol">♠</span><span>AFTERHOURS / MEMBER ACCESS</span></div>
    <div class="kicker">WELCOME TO THE TABLE</div>
    <h2 id="authTitle">歡迎回來</h2>
    <p id="authIntro" class="card-intro">登入帳號，今晚繼續開桌。</p>
    <div class="auth-tabs" role="tablist" aria-label="帳號操作">
     <button type="button" data-mode="login" role="tab" aria-selected="true">登入</button>
     <button type="button" data-mode="register" role="tab" aria-selected="false">邀請碼註冊</button>
    </div>
    <form id="loginForm" class="auth-form">
     <label>帳號<input name="username" autocomplete="username" placeholder="輸入你的帳號" required></label>
     <label>密碼<input name="password" type="password" autocomplete="current-password" placeholder="輸入密碼" required></label>
     <button class="page-button">進入俱樂部 <span>↗</span></button>
    </form>
    <form id="registerForm" class="auth-form" hidden>
     <label>邀請碼<input name="invite" placeholder="輸入朋友給你的邀請碼" required></label>
     <label>顯示暱稱<input name="displayName" maxlength="16" placeholder="朋友怎麼稱呼你？" required></label>
     <label>帳號<input name="username" pattern="[A-Za-z0-9_]{3,24}" autocomplete="username" placeholder="3–24 個英數字或底線" required></label>
     <label>密碼（至少 8 字）<input name="password" type="password" minlength="8" autocomplete="new-password" placeholder="設定登入密碼" required></label>
     <label>確認密碼<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="再次輸入密碼" required></label>
     <button class="page-button">建立帳號 <span>↗</span></button>
    </form>
    <form id="resetForm" class="auth-form" hidden>
     <p class="form-note">透過管理者提供的一次性連結設定新密碼。</p>
     <label>新密碼（至少 8 字）<input name="password" type="password" minlength="8" autocomplete="new-password" placeholder="設定新密碼" required></label>
     <label>確認新密碼<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" placeholder="再次輸入新密碼" required></label>
     <button class="page-button">重設密碼 <span>↗</span></button>
    </form>
    <p id="message" class="form-message" role="status" aria-live="polite"></p>
    <div class="card-footer"><span>INVITE ONLY</span><span>好朋友的私人桌遊空間</span></div>
   </section>
  </main>
 </div>
 <script src="/shared/ui-components.js"></script><script src="/shared/barrage-frames.js"></script><script src="/shared/motion-policy.js"></script><script src="/shared/audio-settings.js"></script><script src="/shared/popovers.js"></script><script src="/login.js"></script>
<script src="/shared/site-header.js"></script></body>
</html>
